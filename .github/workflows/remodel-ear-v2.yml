name: Tek seferlik 3B kulak kesit modeli v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remodel-ear-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js ortamını hazırla
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Geçici model betiğini güvenli spline konturlarıyla hazırla
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/remodel-ear-v2.py')
          t=p.read_text(encoding='utf-8')

          a=t.index('  const outline=new THREE.Shape();')
          b=t.index('  const plate=add(',a)
          outline='''  const outline=new THREE.Shape();
          outline.moveTo(-1.47,-1.48);
          outline.splineThru([new THREE.Vector2(-1.72,-.92),new THREE.Vector2(-1.76,-.10),new THREE.Vector2(-1.58,.78),new THREE.Vector2(-1.22,1.43),new THREE.Vector2(-.73,1.58),new THREE.Vector2(-.24,1.30),new THREE.Vector2(.02,.78),new THREE.Vector2(-.24,.37),new THREE.Vector2(-.68,.10),new THREE.Vector2(-.58,-.57),new THREE.Vector2(-.82,-1.35),new THREE.Vector2(-1.18,-1.60),new THREE.Vector2(-1.47,-1.48)]);
          outline.closePath();
          '''
          t=t[:a]+outline+t[b:]

          a=t.index('  const cut=new THREE.Shape();')
          b=t.index('  add(extrude(cut',a)
          cut='''  const cut=new THREE.Shape();
          cut.moveTo(-.29,-.44);
          cut.splineThru([new THREE.Vector2(-.27,1.39),new THREE.Vector2(.30,1.52),new THREE.Vector2(1.24,1.48),new THREE.Vector2(1.88,.98),new THREE.Vector2(1.98,.25),new THREE.Vector2(1.72,-.76),new THREE.Vector2(1.06,-1.24),new THREE.Vector2(.30,-.90),new THREE.Vector2(-.29,-.44)]);
          cut.closePath();
          '''
          t=t[:a]+cut+t[b:]

          t=t.replace(
            '  ear:{"ear-canal":surface([-.72,-.08,.64]),eardrum:inside([-.18,-.04,.72]),ossicles:inside([.20,.12,.75]),"eustachian-tube":inside([.38,-.85,.68]),vestibule:inside([.62,.06,.76]),"semicircular-canals":inside([.72,.70,.72]),cochlea:inside([1.02,-.16,.75]),"auditory-nerve":inside([1.48,-.05,.66])},',
            '  ear:{"ear-canal":surface([-.88,-.14,.68]),eardrum:inside([-.14,-.07,.76]),ossicles:inside([.24,.18,.80]),"eustachian-tube":inside([.62,-.88,.72]),vestibule:inside([.65,.13,.80]),"semicircular-canals":inside([.82,.72,.80]),cochlea:inside([1.08,-.15,.80]),"auditory-nerve":inside([1.55,.02,.72])},'
          )
          p.write_text(t,encoding='utf-8')
          PY

      - name: Referanstaki anatomik kesit düzenini uygula
        run: python scripts/remodel-ear-v2.py

      - name: Geçici dosyaları çalışma ağacından kaldır
        run: rm .github/workflows/remodel-ear-v2.yml scripts/remodel-ear-v2.py

      - name: Türleri, 3B geometri testlerini ve üretim paketini doğrula
        run: npm run release:check

      - name: Doğrulanmış kulak modelini kaydet
        run: |
          git config user.name "YKS Defterim Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(atlas): rebuild ear as anatomical 3D cutaway"
          git push origin HEAD:main
