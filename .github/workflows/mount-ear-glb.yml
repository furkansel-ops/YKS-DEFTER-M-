name: Tek seferlik özel 3B kulak modelini monte et

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/mount-ear-glb.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js ortamını hazırla
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Python ortamını hazırla
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: 3B model üretim bağımlılıklarını kur
        run: python -m pip install --disable-pip-version-check "numpy==2.3.5" "scipy>=1.15,<2" "trimesh==4.11.1"

      - name: Uygulama bağımlılıklarını kur
        run: npm ci

      - name: Hazırlanan kulak modelini GLB olarak monte et
        run: python scripts/install-custom-ear-model.py

      - name: Geçici montaj dosyalarını kaldır
        run: rm .github/workflows/mount-ear-glb.yml scripts/install-custom-ear-model.py

      - name: Türleri, testleri ve üretim paketini doğrula
        run: npm run release:check

      - name: Doğrulanmış kulak modelini kaydet
        run: |
          git config user.name "YKS Defterim Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(atlas): mount custom reference ear GLB"
          git push origin HEAD:main
