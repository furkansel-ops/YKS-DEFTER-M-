name: v4.1.0 stable release

on:
  push:
    paths:
      - '.github/workflows/release-v4.1.0.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'chore: add v4.1.0 release automation'
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js ortamını hazırla
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: v4.1.0 kimliğini atomik hazırla
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');

          const root=process.cwd();
          const files=[
            'package.json','package-lock.json','version.json','index.html','app.js','sw.js',
            'src/main.ts','src/release/release.ts','src/pwa/pwa-runtime.ts',
            'scripts/verify-dist.mjs','scripts/verify-release.mjs','tests/package.test.js','RELEASE.md'
          ];

          function read(file){return fs.readFileSync(path.join(root,file),'utf8');}
          function write(file,text){fs.writeFileSync(path.join(root,file),text,'utf8');}
          function replaceRequired(text,from,to,file){
            if(!text.includes(from))throw new Error(`${file}: beklenen kimlik bulunamadı: ${from}`);
            return text.split(from).join(to);
          }

          for(const file of files){
            if(!fs.existsSync(path.join(root,file)))throw new Error(`Eksik release dosyası: ${file}`);
          }

          // JSON sürüm kaynakları
          const pkg=JSON.parse(read('package.json'));
          if(pkg.version!=='4.0.0')throw new Error(`package.json beklenmeyen sürüm: ${pkg.version}`);
          pkg.version='4.1.0';
          write('package.json',JSON.stringify(pkg,null,2)+'\n');

          const lock=JSON.parse(read('package-lock.json'));
          if(lock.version!=='4.0.0'||lock.packages?.['']?.version!=='4.0.0')throw new Error('package-lock kök sürümü 4.0.0 değil');
          lock.version='4.1.0';lock.packages[''].version='4.1.0';
          write('package-lock.json',JSON.stringify(lock,null,2)+'\n');

          const version=JSON.parse(read('version.json'));
          if(version.version!=='4.0.0')throw new Error(`version.json beklenmeyen sürüm: ${version.version}`);
          Object.assign(version,{version:'4.1.0',channel:'Kararlı',schema:21,released:'2026-08-26',status:'Kararlı',build:'2026-08-26'});
          write('version.json',JSON.stringify(version)+'\n');

          // Aktif kaynaklar ve doğrulayıcılar. Tarihsel MIGRATION-V4.md bilinçli olarak değiştirilmez.
          const active=['index.html','app.js','sw.js','src/main.ts','src/release/release.ts','src/pwa/pwa-runtime.ts','scripts/verify-dist.mjs','scripts/verify-release.mjs','tests/package.test.js','RELEASE.md'];
          for(const file of active){
            let text=read(file);
            if(text.includes('4.0.0-r19'))text=text.split('4.0.0-r19').join('4.1.0-r20');
            if(text.includes('v4.0.0'))text=text.split('v4.0.0').join('v4.1.0');
            if(text.includes('4.0.0'))text=text.split('4.0.0').join('4.1.0');
            write(file,text);
          }

          // app.js yapım tarihi final kararlı sürüm tarihiyle aynı olsun.
          let app=read('app.js');
          app=app.replace('const APP_BUILD="2026-08-24";','const APP_BUILD="2026-08-26";');
          write('app.js',app);

          // Release kimliklerinin birbirine bağlı olduğunu açıkça doğrula.
          const sw=read('sw.js'),html=read('index.html'),main=read('src/main.ts');
          const checks=[
            [sw.includes('const APP_VERSION="4.1.0"'),'sw APP_VERSION'],
            [sw.includes('const APP_BUILD="4.1.0-r20"'),'sw APP_BUILD'],
            [sw.includes('yks-core-v4.1.0-r20'),'sw cache'],
            [html.includes('app.js?v=4.1.0-r20'),'index app build'],
            [app.includes('const APP_VERSION="4.1.0"'),'app APP_VERSION'],
            [main.includes('version:"4.1.0"'),'TypeScript bootstrap version']
          ];
          for(const [ok,name] of checks)if(!ok)throw new Error(`Release kimliği tutarsız: ${name}`);
          NODE

      - name: v4.1.0 release kontrollerini çalıştır
        run: npm run release:check

      - name: Kararlı sürümü commit et
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json version.json index.html app.js sw.js src/main.ts src/release/release.ts src/pwa/pwa-runtime.ts scripts/verify-dist.mjs scripts/verify-release.mjs tests/package.test.js RELEASE.md
          git diff --cached --check
          git commit -m "v4.1.0 kararlı: güvenlik, PWA ve performans kapanışı"
          git push origin HEAD:main
