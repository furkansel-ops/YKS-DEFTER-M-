name: v4.1.0 stable release

on:
  push:
    paths:
      - '.github/workflows/release-v4.1.0.yml'

permissions:
  contents: write

jobs:
  release:
    if: "${{ github.event.head_commit.message == 'chore: diagnose v4.1.0 release checks' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node.js ortamını hazırla
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: v4.1.0 kimliğini atomik hazırla
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const root=process.cwd();
          const files=['package.json','package-lock.json','version.json','index.html','app.js','sw.js','src/main.ts','src/release/release.ts','src/pwa/pwa-runtime.ts','scripts/verify-dist.mjs','scripts/verify-release.mjs','tests/package.test.js','RELEASE.md'];
          const read=file=>fs.readFileSync(path.join(root,file),'utf8');
          const write=(file,text)=>fs.writeFileSync(path.join(root,file),text,'utf8');
          for(const file of files)if(!fs.existsSync(path.join(root,file)))throw new Error(`Eksik release dosyası: ${file}`);

          const pkg=JSON.parse(read('package.json'));
          if(pkg.version!=='4.0.0')throw new Error(`package.json beklenmeyen sürüm: ${pkg.version}`);
          pkg.version='4.1.0';write('package.json',JSON.stringify(pkg,null,2)+'\n');

          const lock=JSON.parse(read('package-lock.json'));
          if(lock.version!=='4.0.0'||lock.packages?.['']?.version!=='4.0.0')throw new Error('package-lock kök sürümü 4.0.0 değil');
          lock.version='4.1.0';lock.packages[''].version='4.1.0';write('package-lock.json',JSON.stringify(lock,null,2)+'\n');

          const version=JSON.parse(read('version.json'));
          if(version.version!=='4.0.0')throw new Error(`version.json beklenmeyen sürüm: ${version.version}`);
          Object.assign(version,{version:'4.1.0',channel:'Kararlı',schema:21,released:'2026-08-26',status:'Kararlı',build:'2026-08-26'});
          write('version.json',JSON.stringify(version)+'\n');

          const active=['index.html','app.js','sw.js','src/main.ts','src/release/release.ts','src/pwa/pwa-runtime.ts','scripts/verify-dist.mjs','scripts/verify-release.mjs','tests/package.test.js','RELEASE.md'];
          for(const file of active){
            let text=read(file);
            text=text.split('4.0.0-r19').join('4.1.0-r20');
            text=text.split('v4.0.0').join('v4.1.0');
            text=text.split('4.0.0').join('4.1.0');
            write(file,text);
          }
          let app=read('app.js');app=app.replace('const APP_BUILD="2026-08-24";','const APP_BUILD="2026-08-26";');write('app.js',app);
          const sw=read('sw.js'),html=read('index.html'),main=read('src/main.ts');
          const checks=[[sw.includes('const APP_VERSION="4.1.0"'),'sw APP_VERSION'],[sw.includes('const APP_BUILD="4.1.0-r20"'),'sw APP_BUILD'],[sw.includes('yks-core-v4.1.0-r20'),'sw cache'],[html.includes('app.js?v=4.1.0-r20'),'index app build'],[app.includes('const APP_VERSION="4.1.0"'),'app APP_VERSION'],[main.includes('version:"4.1.0"'),'TypeScript bootstrap version']];
          for(const [ok,name] of checks)if(!ok)throw new Error(`Release kimliği tutarsız: ${name}`);
          NODE

      - name: TypeScript kontrolü
        run: npm run typecheck
      - name: Test backup-service
        run: node --test tests/backup-service.test.js
      - name: Test cloud-state
        run: node --test tests/cloud-state.test.js
      - name: Test common-services
        run: node --test tests/common-services.test.js
      - name: Test core-utils
        run: node --test tests/core-utils.test.js
      - name: Test data-layer
        run: node --test tests/data-layer.test.js
      - name: Test data-migration
        run: node --test tests/data-migration.test.js
      - name: Test domain-services
        run: node --test tests/domain-services.test.js
      - name: Test exam-analysis
        run: node --test tests/exam-analysis.test.js
      - name: Test feature-modules
        run: node --test tests/feature-modules.test.js
      - name: Test live-pages
        run: node --test tests/live-pages.test.js
      - name: Test package
        run: node --test tests/package.test.js
      - name: Test primary-store
        run: node --test tests/primary-store.test.js
      - name: Test progress-analysis
        run: node --test tests/progress-analysis.test.js
      - name: Test release
        run: node --test tests/release.test.js
      - name: Test screen-runtime
        run: node --test tests/screen-runtime.test.js
      - name: Production build
        run: npm run build
      - name: Release doğrulama
        run: node scripts/verify-release.mjs

      - name: Kararlı sürümü commit et
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json version.json index.html app.js sw.js src/main.ts src/release/release.ts src/pwa/pwa-runtime.ts scripts/verify-dist.mjs scripts/verify-release.mjs tests/package.test.js RELEASE.md
          git diff --cached --check
          git commit -m "v4.1.0 kararlı: güvenlik, PWA ve performans kapanışı"
          git push origin HEAD:main
