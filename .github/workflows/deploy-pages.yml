name: Vite uygulamasını GitHub Pages'e dağıt

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node.js ortamını hazırla
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      # Normal kod push'u mevcut çalışan Hocalar paketini silmemeli. Önce canlı
      # Pages feed + sayfalı arşiv geri alınır; erişilemiyorsa seed dosya korunur.
      - name: Son canlı Hocalar medya paketini koru
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          YKS_TEACHERS_MEDIA_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node scripts/restore-teachers-v2-live-media.mjs

      # Tam YouTube taraması yalnız günlük cron veya elle çalıştırılan workflow'da.
      # Push dağıtımı ağ hızına bağlı kalmaz ve son sağlam tam arşivi korur.
      - name: Hocalar v2 medya akışını ağdan yenile
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python3 -m pip install --disable-pip-version-check --quiet yt-dlp
          python3 -m yt_dlp --version
          timeout --signal=TERM --kill-after=5s 90s node scripts/refresh-teachers-v2-feed.mjs \
            || echo "[teachers-v2] yenileme süre bütçesini aştı; mevcut sağlam feed korunuyor"

      # Doğrulanmış kanal kimliği olan hocaların son videolarını hafif YouTube RSS
      # akışından günceller. yt-dlp gerekmez; Ferrum da bu katmanda doğrudan bağlıdır.
      - name: Hocalar v2 hızlı video önizlemesini hazırla
        run: node scripts/patch-teachers-v2-known-custom.mjs

      # Tam arşiv ağırdır. Push'ta canlıdan geri alınan arşivi olduğu gibi koru;
      # cron/manual çalışmada yt-dlp hazırken arşivi yeniden oluştur.
      - name: Hocalar v2 sayfalı tam arşivini yenile
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/build-teachers-v2-archives.mjs

      - name: Kararlı sürümü doğrula ve derle
        run: npm run release:check

      - name: Yayın kimliğini hazırla
        run: |
          node -e '
            const fs=require("node:fs");
            const release=JSON.parse(fs.readFileSync("version.json","utf8"));
            fs.appendFileSync(process.env.GITHUB_ENV,`RELEASE_VERSION=${release.version}\nRELEASE_BUILD=${release.build}\n`);
          '

      - name: Kararlı sürüm yedek ZIP'ini hazırla
        run: |
          rm -rf .release-backup "YKS-Defterim-v${RELEASE_VERSION}-backup.zip"
          mkdir -p .release-backup/source .release-backup/production
          git archive HEAD | tar -x -C .release-backup/source
          cp -a dist/. .release-backup/production/
          printf 'YKS Defterim v%s\nBuild: %s\nCommit: %s\n' "$RELEASE_VERSION" "$RELEASE_BUILD" "$GITHUB_SHA" > .release-backup/BACKUP-INFO.txt
          (cd .release-backup && zip -qr "../YKS-Defterim-v${RELEASE_VERSION}-backup.zip" .)

      - name: Yedek ZIP artefaktını yükle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yks-defterim-v${{ env.RELEASE_VERSION }}-backup
          path: YKS-Defterim-v${{ env.RELEASE_VERSION }}-backup.zip
          if-no-files-found: error
          retention-days: 30

      - name: GitHub Pages'i hazırla
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Üretim paketini yükle
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node.js ortamını hazırla
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: GitHub Pages'e dağıt
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

      - name: Canlı sürümü doğrula
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-live-pages.mjs
