name: Vite uygulamasını GitHub Pages'e dağıt

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js ortamını hazırla
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: Kararlı sürümü doğrula ve derle
        run: npm run release:check

      - name: v4.3.1 yedek ZIP'ini hazırla
        run: |
          rm -rf .release-backup YKS-Defterim-v4.3.1-backup.zip
          mkdir -p .release-backup/source .release-backup/production
          git archive HEAD | tar -x -C .release-backup/source
          cp -a dist/. .release-backup/production/
          printf 'YKS Defterim v4.3.1\nBuild: 4.3.1-r1\nCommit: %s\n' "$GITHUB_SHA" > .release-backup/BACKUP-INFO.txt
          (cd .release-backup && zip -qr ../YKS-Defterim-v4.3.1-backup.zip .)

      - name: Yedek ZIP artefaktını yükle
        uses: actions/upload-artifact@v4
        with:
          name: yks-defterim-v4.3.1-backup
          path: YKS-Defterim-v4.3.1-backup.zip
          if-no-files-found: error
          retention-days: 30

      - name: GitHub Pages'i hazırla
        uses: actions/configure-pages@v6

      - name: Üretim paketini yükle
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Node.js ortamını hazırla
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # deploy-pages job conclusion değeri GitHub tarafından yönetilir; eski Pages dağıtımı ayrıca beklenmez.
      - name: GitHub Pages'e dağıt
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Canlı sürümü doğrula
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-live-pages.mjs
