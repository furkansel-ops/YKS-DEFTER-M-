name: Kod kalitesi ve kararlı sürüm denetimi

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      windows_source:
        description: "İsteğe bağlı Windows paketi: bu dalın geçmişindeki tam 40 karakterli kaynak commit SHA'sı"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-package:
    name: İstenen kaynak commitinden Windows test paketi
    if: github.event_name == 'workflow_dispatch' && inputs.windows_source != ''
    needs: [verify, runtime-compat]
    uses: ./.github/workflows/build-windows.yml
    with:
      source_ref: ${{ inputs.windows_source }}
    permissions:
      contents: read

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node.js ortamını hazırla
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: Türleri, testleri ve üretim paketini doğrula
        run: npm run release:check

  runtime-compat:
    name: Node 24 uyumluluk denetimi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node.js 24 ortamını hazırla
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: Gelecek Node sürümünde tür ve test uyumluluğunu doğrula
        run: npm run infra:check && npm run typecheck && npm test
