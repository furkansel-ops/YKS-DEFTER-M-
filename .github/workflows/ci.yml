name: Kod kalitesi ve kararlı sürüm denetimi

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node.js ortamını hazırla
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: Altyapı kurallarını doğrula
        run: npm run infra:check

      - name: TypeScript türlerini doğrula
        run: npm run typecheck

      - name: Test çıktısını yakala
        run: |
          set +e
          node --test tests/*.test.js > test-output.txt 2>&1
          code=$?
          echo "TEST_EXIT=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Test çıktısını yükle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-output-node22
          path: test-output.txt
          if-no-files-found: error
          retention-days: 1

      - name: Test sonucunu doğrula
        run: test "$TEST_EXIT" = "0"

      - name: Kararlı sürüm paketini doğrula
        run: |
          npm run build:assets
          node scripts/verify-release.mjs
          node scripts/verify-v440-production.mjs

  runtime-compat:
    name: Node 24 uyumluluk denetimi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node.js 24 ortamını hazırla
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci --no-audit --no-fund

      - name: Altyapı kurallarını doğrula
        run: npm run infra:check

      - name: TypeScript türlerini doğrula
        run: npm run typecheck

      - name: Testleri çalıştır
        run: npm test
