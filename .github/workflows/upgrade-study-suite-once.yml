name: Upgrade study suite once

on:
  push:
    branches:
      - main
    paths:
      - .upgrade-study-suite-trigger

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply ordered upgrades
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/upgrade-study-suite.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace("anchor = '  <script vite-ignore src=\"./modules/release-selftest.js?v=4.1.0-r20\"></script>'", "anchor = '<script vite-ignore src=\"./modules/release-selftest.js?v=4.1.0-r20\"></script>'")
          p.write_text(s,encoding='utf-8')
          PY
          python3 scripts/upgrade-study-suite.py
      - name: Verify all stages
        run: npm run release:check
      - name: Verify intelligence stays read-only
        run: node -e "const c=require('./modules/study-intelligence-core.js'); const r=c.selfTest(); if(!r.ok||!r.checks.readOnly) process.exit(1);"
      - name: Commit verified upgrade
        shell: bash
        run: |
          rm -f .upgrade-study-suite-trigger .github/workflows/upgrade-study-suite-once.yml scripts/upgrade-study-suite.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: upgrade atlas and study intelligence suite"
          git push
