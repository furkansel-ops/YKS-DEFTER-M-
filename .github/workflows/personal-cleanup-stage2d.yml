name: Personal cleanup stage 2d

on:
  push:
    paths:
      - '.github/workflows/personal-cleanup-stage2d.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message == 'chore: tek kullanıcı temizliği aşama 2d' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Derin tek kullanıcı yamasını uygula
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/personal-cleanup-stage2b.yml').read_text()
          start=s.index("          node <<'NODE'\n")+len("          node <<'NODE'\n")
          end=s.index("\n          NODE",start)
          lines=s[start:end].splitlines()
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/personal-patch.js').write_text(script)
          PY
          node /tmp/personal-patch.js
      - name: Eski rol testlerini kişisel moda uyarla
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const dir='tests';
          let changed=0, found=0;
          for(const file of fs.readdirSync(dir).filter(x=>x.endsWith('.js'))){
            const p=path.join(dir,file);let s=fs.readFileSync(p,'utf8');
            if(s.includes('mode-coach')){
              found++;
              const before=s;
              s=s.replace(/assert\.match\(css,\/body\\\.mode-coach\\\{\/\);/g,'assert.doesNotMatch(css,/body\\.mode-coach\\{/);');
              s=s.replace(/assert\.match\(css,\/body\.mode-coach\{\/\);/g,'assert.doesNotMatch(css,/body\\.mode-coach\\{/);');
              if(s!==before){fs.writeFileSync(p,s,'utf8');changed++;}
            }
          }
          const pkg='tests/package.test.js';let s=fs.readFileSync(pkg,'utf8');
          const bad='assert.match(app,/manualReviews||[]).forEach/);';
          if(s.includes(bad))s=s.replace(bad,'assert.ok(app.includes("manualReviews||[]).forEach"));');
          fs.writeFileSync(pkg,s,'utf8');
          console.log({foundModeCoachTests:found,changedModeCoachTests:changed});
          const still=fs.readdirSync(dir).filter(x=>x.endsWith('.js')).flatMap(file=>{
            const text=fs.readFileSync(path.join(dir,file),'utf8');
            return text.includes('assert.match(css,/body\\.mode-coach\\{/);')?[file]:[];
          });
          if(still.length)throw new Error('Eski mode-coach assertion kaldı: '+still.join(','));
          NODE
      - name: Tam sürüm kontrolü
        run: npm run release:check
      - name: Uygulama değişikliklerini commit et
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html app.css modules/error-journal.js tests
          git diff --cached --check
          git commit -m "refactor: kişisel tek kullanıcı akışını derinleştir"
          git push origin HEAD:main
