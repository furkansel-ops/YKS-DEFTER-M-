name: Coach challenge rules emulator

on:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'security-tests/**'
      - 'functions/coach-rewards/**'
      - '.github/workflows/coach-challenge-security.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix security-tests --no-fund --no-audit
      - name: Firebase Emulator rule tests
        run: ./security-tests/node_modules/.bin/firebase emulators:exec --project demo-coach-security --only firestore "node security-tests/coach-rules.test.mjs"
      - name: Trusted XP policy tests
        run: node --test tests/coach-receipts.test.js
