name: Fix personal cleanup test

on:
  push:
    paths:
      - '.github/workflows/fix-personal-cleanup-test.yml'

permissions:
  contents: write

jobs:
  fix:
    if: "${{ github.event.head_commit.message == 'chore: hata defteri tekrar testini düzelt' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hatalı regex yerine düz metin assertion kullan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/personal-cleanup-stage2b.yml')
          s=p.read_text()
          old='assert.match(app,/manualReviews\\|\\|\\[\\]\\)\\.forEach/);'
          new='assert.ok(app.includes("manualReviews||[]).forEach"));'
          if old not in s:
              raise SystemExit('hedef assertion bulunamadı')
          p.write_text(s.replace(old,new))
          PY
      - name: Yeniden tetikle
        shell: bash
        run: |
          rm -f .github/workflows/fix-personal-cleanup-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/personal-cleanup-stage2b.yml .github/workflows/fix-personal-cleanup-test.yml
          git diff --cached --check
          git commit -m "chore: tek kullanıcı temizliği aşama 2b"
          git push origin HEAD:main
