name: Tek seferlik referans tabanlı 3B kulak iyileştirmesi

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refine-ear-reference-model.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js ortamını hazırla
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Referans tabanlı 3B kulak geometrisini uygula
        run: |
          python scripts/refine-ear-reference-model.py
          sed -i 's/-.58-1.13/-.58,-1.13/' src/ui/biology-ear-source.ts
          sed -i 's/.83-1.12,1.16-1.38/.83,-1.12,1.16,-1.38/' src/ui/biology-ear-source.ts

      - name: Geçici dosyaları çalışma ağacından kaldır
        run: rm .github/workflows/refine-ear-reference-model.yml scripts/refine-ear-reference-model.py

      - name: Türleri, testleri ve üretim paketini doğrula
        run: npm run release:check

      - name: Doğrulanmış 3B kulak güncellemesini kaydet
        run: |
          git config user.name "YKS Defterim Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(atlas): remodel ear from anatomical cutaway reference"
          git push origin HEAD:main
