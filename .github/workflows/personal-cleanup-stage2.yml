name: Personal cleanup stage 2

on:
  push:
    paths:
      - '.github/workflows/personal-cleanup-stage2.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message == 'chore: tek kullanıcı temizliği aşama 2' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rol davranışını kaldır ve Bugün'e hata özeti bağla
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const read=f=>fs.readFileSync(f,'utf8'),write=(f,s)=>fs.writeFileSync(f,s,'utf8');
          let app=read('app.js');
          app=app.replace('  role:"ogrenci",coachNotes:[],watched:{},lastExport:0,briefDay:"",','  watched:{},lastExport:0,briefDay:"",');
          app=app.replace(/\n  if\(!Array\.isArray\(o\.coachNotes\)\)o\.coachNotes=\[\];[\s\S]*?\.slice\(-200\);\n  delete o\.pdfs;/,'\n  delete o.role; delete o.coachNotes;\n  delete o.pdfs;');
          app=app.replace('delete o.sync; delete o.rev; delete o.revAt; delete o.coachEmail;   /* bulut eşitlemesi kaldırıldı */','delete o.sync; delete o.rev; delete o.revAt; delete o.coachEmail; delete o.role; delete o.coachNotes;   /* tek kullanıcı */');
          const guards=[
            '  if(typeof coachBlock==="function"&&coachBlock("soru kaydı"))return;\n',
            '  if(typeof coachBlock==="function"&&coachBlock("günlük kaydı"))return;\n',
            '  if(typeof coachBlock==="function"&&coachBlock("deneme kaydı"))return;\n',
            '  if(typeof coachBlock==="function"&&coachBlock("pomodoro"))return;\n',
            '  if(typeof coachBlock==="function"&&coachBlock("kronometre"))return;\n',
            '  if(typeof isCoach==="function"&&isCoach()){ w.style.display="none"; return; }\n',
            '  if(typeof coachBlock==="function"&&isCoach()){ toast("Koç kipinde gün ekranı yok"); return false; }\n',
            '  if(typeof isCoach==="function"&&isCoach())return false;\n',
            '  if(typeof isCoach==="function"&&isCoach())return;\n'
          ];
          guards.forEach(g=>{app=app.split(g).join('');});
          const roleStart=app.indexOf('   ROL: ÖĞRENCİ / KOÇ');
          if(roleStart>=0){
            const commentStart=app.lastIndexOf('/* ==================================================================',roleStart);
            const noteStart=app.indexOf('/* ==================================================================\n   KOÇ NOTLARI',roleStart);
            if(commentStart>=0&&noteStart>commentStart){
              app=app.slice(0,commentStart)+'/* Tek kullanıcı uyumluluk kabuğu: eski çağrılar no-op. */\nfunction isCoach(){return false;}\nfunction setRole(){return false;}\nfunction applyRole(){return false;}\nfunction coachBlock(){return false;}\n\n'+app.slice(noteStart);
            }
          }
          write('app.js',app);

          let html=read('index.html');
          const anchor='<div id="todayReviews"></div>';
          if(html.includes(anchor)&&!html.includes('id="errorJournalToday"')){
            html=html.replace(anchor,anchor+'\n      <div id="errorJournalToday" class="error-journal-today"></div>');
          }
          write('index.html',html);

          let mod=read('modules/error-journal.js');
          if(!mod.includes('function renderTodaySummary()')){
            mod=mod.replace('  window.errorJournalRender=function(){','  function renderTodaySummary(){\n    const box=field("errorJournalToday");if(!box)return;\n    const list=state(),open=list.filter(x=>x&&!x.resolved);\n    if(!open.length){box.innerHTML="";box.style.display="none";return;}\n    const top=TYPES.map(t=>[t,open.filter(x=>x.type===t).length]).sort((a,b)=>b[1]-a[1])[0];\n    box.style.display="block";\n    box.innerHTML=\'<div class="today-section-head"><b>Hata Defteri</b><button type="button" onclick="go(\\\'deneme\\\');setTimeout(()=>document.getElementById(\\\'errorJournalRoot\\\')?.scrollIntoView({behavior:\\\'smooth\\\'}),80)">Aç</button></div><div class="error-journal-today-line"><b>\'+open.length+\'</b><span>aktif hata · en sık: \'+esc(top&&top[1]?top[0]:"—")+\'</span></div>\';\n  }\n  window.errorJournalRender=function(){');
            mod=mod.replace("    if(!visible.length){root.innerHTML='<div class=\"card empty\">Henüz eşleşen hata kaydı yok.</div>';return;}","    renderTodaySummary();\n    if(!visible.length){root.innerHTML='<div class=\"card empty\">Henüz eşleşen hata kaydı yok.</div>';return;}");
            mod=mod.replace("    root.innerHTML=visible.map(x=>", "    renderTodaySummary();\n    root.innerHTML=visible.map(x=>");
          }
          write('modules/error-journal.js',mod);

          let css=read('app.css');
          if(!css.includes('error-journal-today-line'))css+='\n.error-journal-today{margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--fill)}.error-journal-today-line{display:flex;gap:8px;align-items:baseline}.error-journal-today-line b{font-size:20px}.error-journal-today-line span{font-size:13px;color:var(--label-2)}\n';
          write('app.css',css);

          let test=read('tests/package.test.js');
          if(!test.includes('tek kullanıcı derin temizliği'))test+='\n\ntest("tek kullanıcı derin temizliği ve Hata Defteri Bugün özeti",()=>{\n  const app=fs.readFileSync(path.join(root,"app.js"),"utf8"),html=fs.readFileSync(path.join(root,"index.html"),"utf8"),mod=fs.readFileSync(path.join(root,"modules/error-journal.js"),"utf8");\n  assert.doesNotMatch(app,/role:\"ogrenci\"|coachNotes:\[\]/);\n  assert.doesNotMatch(app,/coachBlock\(\"(?:soru kaydı|günlük kaydı|deneme kaydı|pomodoro|kronometre)\"\)/);\n  assert.match(app,/function isCoach\(\)\{return false;\}/);\n  assert.match(app,/delete o\.role; delete o\.coachNotes/);\n  assert.match(html,/id=\"errorJournalToday\"/);\n  assert.match(mod,/function renderTodaySummary\(\)/);\n});\n';
          write('tests/package.test.js',test);
          NODE
      - name: Kontroller
        run: npm run release:check
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/personal-cleanup-stage2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html app.css modules/error-journal.js tests/package.test.js .github/workflows/personal-cleanup-stage2.yml
          git diff --cached --check
          git commit -m "refactor: tek kullanıcı davranışını sadeleştir ve hata özetini bağla"
          git push origin HEAD:main
