name: Program input performance fix

on:
  push:
    paths:
      - '.github/workflows/program-input-performance.yml'

permissions:
  contents: write

jobs:
  optimize:
    if: "${{ github.event.head_commit.message == 'chore: refine program input performance fix' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Program yazma akışını hafiflet
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          let s=fs.readFileSync('app.js','utf8');
          if(s.includes('function programSummarySchedule(')) throw new Error('Program özet optimizasyonu zaten mevcut');

          const marker='document.querySelectorAll("#gridR [data-blk],#gridS [data-blk]").forEach(e=>{';
          const start=s.indexOf(marker);
          if(start<0) throw new Error('Program hücre binding bloğu bulunamadı');

          const helper=`let programSummaryTimer=null;\nfunction programSummaryRefreshNow(){\n  if(programSummaryTimer){clearTimeout(programSummaryTimer);programSummaryTimer=null;}\n  const wkLive=keyOf(curWeek),wLive=getWeek(wkLive,false);\n  if(wLive)renderProgramSummary(wkLive,wLive);\n}\nfunction programSummarySchedule(){\n  if(programSummaryTimer)clearTimeout(programSummaryTimer);\n  programSummaryTimer=setTimeout(()=>{programSummaryTimer=null;programSummaryRefreshNow();},320);\n}\n\n`;
          s=s.slice(0,start)+helper+s.slice(start);

          const heavy='saveSoon(180);perfRAF("program-summary",()=>{const wkLive=keyOf(curWeek),wLive=getWeek(wkLive,false);if(wLive)renderProgramSummary(wkLive,wLive);});';
          const count=s.split(heavy).length-1;
          if(count<1||count>4) throw new Error(`Beklenmeyen ağır program handler sayısı: ${count}`);
          s=s.split(heavy).join('saveSoon(220);programSummarySchedule();');

          const blur='e.addEventListener("blur",()=>flushSaveSoon());';
          const blurCount=s.split(blur).length-1;
          if(blurCount<1||blurCount>4) throw new Error(`Beklenmeyen program blur handler sayısı: ${blurCount}`);
          s=s.split(blur).join('e.addEventListener("blur",()=>{flushSaveSoon();programSummaryRefreshNow();});');

          fs.writeFileSync('app.js',s,'utf8');
          NODE
      - name: Program performans regresyon testi ekle
        shell: bash
        run: |
          cat > tests/program-performance.test.js <<'EOF'
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const app=fs.readFileSync('app.js','utf8');
          test('program yazarken haftalık özet her tuşta yeniden çizilmez',()=>{
            assert.match(app,/function programSummarySchedule\(/);
            assert.match(app,/setTimeout\(\(\)=>\{programSummaryTimer=null;programSummaryRefreshNow\(\);\},320\)/);
            assert.match(app,/saveSoon\(220\);programSummarySchedule\(\)/);
            assert.match(app,/flushSaveSoon\(\);programSummaryRefreshNow\(\)/);
            const start=app.indexOf('document.querySelectorAll("#gridR [data-blk],#gridS [data-blk]")');
            const end=app.indexOf('function bindPlanLongPress()',start);
            const block=app.slice(start,end);
            assert.doesNotMatch(block,/perfRAF\("program-summary"/);
          });
          EOF
      - name: Kontroller
        run: |
          node --check app.js
          node --test tests/program-performance.test.js
          npm run release:check
      - name: Düzeltmeyi commit et
        shell: bash
        run: |
          rm .github/workflows/program-input-performance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js tests/program-performance.test.js .github/workflows/program-input-performance.yml
          git diff --cached --check
          git commit -m "perf: program girişini tablette akıcılaştır"
          git push origin HEAD:main
