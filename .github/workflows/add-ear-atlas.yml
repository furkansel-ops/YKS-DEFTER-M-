name: Tek seferlik 3B kulak atlası yükseltmesi

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-ear-atlas.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Node.js ortamını hazırla
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: 3B kulak atlasını ekle
        run: python scripts/add-ear-atlas.py

      - name: Test sözleşmelerini güncelle
        run: python scripts/fix-ear-atlas-tests.py

      - name: Geçici yükseltme dosyalarını çalışma ağacından kaldır
        run: rm .github/workflows/add-ear-atlas.yml scripts/add-ear-atlas.py scripts/fix-ear-atlas-tests.py

      - name: Türleri, testleri ve üretim paketini doğrula
        run: npm run release:check

      - name: Doğrulanmış değişiklikleri kaydet
        run: |
          git config user.name "YKS Defterim Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(atlas): add interactive 3D ear with YKS structures"
          git push origin HEAD:main
