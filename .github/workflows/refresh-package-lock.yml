name: Refresh package lock

on:
  push:
    branches:
      - cleanup-student-repo-upgrade-v45

permissions:
  contents: write

concurrency:
  group: refresh-package-lock-cleanup-v45
  cancel-in-progress: true

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true

      - name: Node.js ortamını hazırla
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: package-lock.json dosyasını yenile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Güncel lock dosyasını kaydet
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json zaten güncel."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh package lock [skip ci]"
          git push
