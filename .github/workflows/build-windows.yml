name: Windows EXE · GitHub Arkadaş Testi

on:
  pull_request:
    paths:
      - ".github/workflows/build-windows.yml"
      - "desktop/**"
      - "scripts/**"
      - "tests/desktop*.test.js"
      - "package.json"
      - "package-lock.json"
      - "version.json"
      - "vite.config.mts"
      - "index.html"
      - "app.js"
      - "app.css"
      - "privacy.html"
      - "data-deletion.html"
      - "src/**"
      - "modules/**"
      - "public/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    name: Windows x64 · Kullanıcı kurulum paketi
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node.js 22 ortamını hazırla
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Bağımlılıkları kilit dosyasından kur
        run: npm ci --no-audit --no-fund

      - name: Web ve masaüstü sözleşmelerini doğrula
        run: npm run release:check

      - name: Windows kurulum dosyasını üret ve doğrula
        run: npm run desktop:pack

      - name: Gerçek Electron açılışını ve çevrimdışı masaüstü akışlarını doğrula
        run: npx --no-install electron desktop/smoke.cjs

      - name: Derlemenin takip edilen kaynakları değiştirmediğini doğrula
        run: git diff --exit-code

      - name: Windows kurulum paketi ve sağlama bilgisini sakla
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yks-defterim-windows-x64
          path: |
            desktop-release/*-Setup.exe
            desktop-release/SHA256SUMS.txt
            desktop-release/windows-release-metadata.json
          if-no-files-found: error
          retention-days: 30

      - name: Test dağıtımı bilgisini yaz
        shell: pwsh
        run: |
          "Windows kurulum paketi artefakt olarak hazırlandı. Bu iş akışı GitHub Release oluşturmaz, main'e merge etmez ve mağazada yayın yapmaz." >> $env:GITHUB_STEP_SUMMARY
          "Windows kod imzalama sertifikası yapılandırılmadı; imzasız test paketi SmartScreen uyarısı gösterebilir. SHA256SUMS.txt dosyasını paketle birlikte paylaşın." >> $env:GITHUB_STEP_SUMMARY
