name: Personal single-user + error journal

on:
  push:
    paths:
      - '.github/workflows/personal-single-user-error-journal.yml'

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: kişisel tek kullanıcı düzenini hazırla' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tek kullanıcı arayüzü ve Hata Defteri
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const read=f=>fs.readFileSync(f,'utf8'),write=(f,s)=>fs.writeFileSync(f,s,'utf8');
          let html=read('index.html');

          // Görünür koç/öğrenci kalıntılarını kaldır. Öğrenciye özel içerikler artık doğrudan kişisel içerik.
          const coachStart=html.indexOf('  <div id="coachBoard"');
          const restAnchor='  <div class="restcard" id="restBanner"';
          const restPos=html.indexOf(restAnchor,coachStart);
          if(coachStart>=0&&restPos>coachStart) html=html.slice(0,coachStart)+html.slice(restPos);
          html=html.replace(/\sdata-student-only(?=[\s>])/g,'');

          // Hata Defteri'ni Deneme ekranının üstüne ekle.
          if(!html.includes('id="errorJournal"')){
            const deneme='<section id="deneme" class="screen">';
            if(!html.includes(deneme))throw new Error('Deneme ekranı bulunamadı');
            const block=`<section id="errorJournal" class="error-journal" aria-labelledby="errorJournalTitle">\n  <div class="error-journal-head">\n    <div><p class="eyebrow">Kişisel kayıt</p><h2 id="errorJournalTitle">Hata Defteri</h2><p class="hint">Yanlış yaptığın soruları nedenleriyle kaydet. Programına dokunmaz; sadece hatalarını görünür hale getirir.</p></div>\n  </div>\n  <div class="card error-journal-form">\n    <div class="row2"><div><label>Ders</label><input id="errorJournalSubject" type="text" maxlength="60" placeholder="Matematik"></div><div><label>Konu</label><input id="errorJournalTopic" type="text" maxlength="80" placeholder="Problemler"></div></div>\n    <label>Hata türü</label>\n    <select id="errorJournalType"><option>Bilgi eksiği</option><option>Dikkat</option><option>İşlem</option><option>Yorum</option><option>Süre</option></select>\n    <label>Kısa not</label><textarea id="errorJournalNote" maxlength="400" rows="3" placeholder="Nerede hata yaptım? Doğrusu neydi?"></textarea>\n    <div class="error-journal-form-actions"><label class="error-journal-review"><input id="errorJournalReview" type="checkbox"> Tekrar listeme ekle</label><button class="btn green small" type="button" onclick="errorJournalAdd()">Hatayı kaydet</button></div>\n  </div>\n  <div class="error-journal-kpis" id="errorJournalKpis"></div>\n  <div class="card flat error-journal-tools"><input id="errorJournalSearch" type="search" placeholder="Ders, konu veya not ara" oninput="errorJournalRender()"><select id="errorJournalFilter" onchange="errorJournalRender()"><option value="all">Tüm hata türleri</option><option>Bilgi eksiği</option><option>Dikkat</option><option>İşlem</option><option>Yorum</option><option>Süre</option></select></div>\n  <div id="errorJournalList" class="error-journal-list"></div>\n</section>\n\n`;
            html=html.replace(deneme,deneme+'\n'+block);
          }
          if(!html.includes('modules/error-journal.js')){
            const anchor='<script vite-ignore src="./modules/release-selftest.js?v=4.1.0-r20"></script>';
            if(!html.includes(anchor))throw new Error('Script anchor bulunamadı');
            html=html.replace(anchor,'<script vite-ignore src="./modules/error-journal.js?v=4.1.0-r20"></script>\n'+anchor);
          }
          write('index.html',html);

          const journal=`/* Kişisel Hata Defteri — tek kullanıcı */\n(function(){\n  const TYPES=["Bilgi eksiği","Dikkat","İşlem","Yorum","Süre"];\n  function esc(v){return String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'\"':"&quot;","'":"&#39;"}[c]));}\n  function state(){\n    if(typeof S!=="object"||!S)return [];\n    if(!Array.isArray(S.errorJournal))S.errorJournal=[];\n    return S.errorJournal;\n  }\n  function persist(){try{if(typeof saveSoon==="function")saveSoon(80);else if(typeof save==="function")save();}catch(e){}}\n  function field(id){return document.getElementById(id);}\n  function norm(v){return String(v||"").trim();}\n  window.errorJournalAdd=function(){\n    const subject=norm(field("errorJournalSubject")?.value),topic=norm(field("errorJournalTopic")?.value),type=norm(field("errorJournalType")?.value)||TYPES[0],note=norm(field("errorJournalNote")?.value);\n    if(!subject||!topic){try{toast("Ders ve konu gerekli");}catch(e){}return;}\n    const item={id:"err_"+Date.now().toString(36)+Math.random().toString(36).slice(2,7),subject,topic,type:TYPES.includes(type)?type:TYPES[0],note,createdAt:Date.now(),resolved:false,review:!!field("errorJournalReview")?.checked};\n    state().unshift(item);\n    if(item.review){\n      try{\n        if(!Array.isArray(S.manualReviews))S.manualReviews=[];\n        S.manualReviews.unshift({id:"rev_"+item.id,subject:item.subject,topic:item.topic,source:"Hata Defteri",createdAt:item.createdAt});\n      }catch(e){}\n    }\n    persist();\n    ["errorJournalSubject","errorJournalTopic","errorJournalNote"].forEach(id=>{const x=field(id);if(x)x.value="";}); const r=field("errorJournalReview");if(r)r.checked=false;\n    window.errorJournalRender();\n    try{toast("Hata Defteri'ne eklendi");}catch(e){}\n  };\n  window.errorJournalToggle=function(id){const x=state().find(v=>v&&v.id===id);if(!x)return;x.resolved=!x.resolved;x.resolvedAt=x.resolved?Date.now():0;persist();window.errorJournalRender();};\n  window.errorJournalDelete=function(id){const list=state(),i=list.findIndex(v=>v&&v.id===id);if(i<0)return;if(!confirm("Bu hata kaydını silmek istiyor musun?"))return;list.splice(i,1);persist();window.errorJournalRender();};\n  window.errorJournalRender=function(){\n    const root=field("errorJournalList"),kpis=field("errorJournalKpis");if(!root||!kpis)return;\n    const list=state(),q=norm(field("errorJournalSearch")?.value).toLocaleLowerCase("tr-TR"),filter=field("errorJournalFilter")?.value||"all";\n    const visible=list.filter(x=>x&&(!q||[x.subject,x.topic,x.type,x.note].join(" ").toLocaleLowerCase("tr-TR").includes(q))&&(filter==="all"||x.type===filter));\n    const open=list.filter(x=>x&&!x.resolved).length; const top=TYPES.map(t=>[t,list.filter(x=>x&&x.type===t).length]).sort((a,b)=>b[1]-a[1])[0];\n    kpis.innerHTML='<div class="error-journal-kpi"><b>'+list.length+'</b><span>toplam kayıt</span></div><div class="error-journal-kpi"><b>'+open+'</b><span>aktif hata</span></div><div class="error-journal-kpi"><b>'+esc(top&&top[1]?top[0]:"—")+'</b><span>en sık neden</span></div>';\n    if(!visible.length){root.innerHTML='<div class="card empty">Henüz eşleşen hata kaydı yok.</div>';return;}\n    root.innerHTML=visible.map(x=>'<article class="card error-journal-item '+(x.resolved?'is-resolved':'')+'"><div class="error-journal-item-head"><div><span class="error-journal-type">'+esc(x.type)+'</span><h3>'+esc(x.subject)+' · '+esc(x.topic)+'</h3></div><button class="btn ghost tiny" type="button" onclick="errorJournalToggle(\\''+esc(x.id)+'\\')">'+(x.resolved?'Geri aç':'Çözüldü')+'</button></div>'+(x.note?'<p>'+esc(x.note)+'</p>':'')+'<div class="error-journal-meta"><span>'+new Date(x.createdAt).toLocaleDateString('tr-TR')+'</span>'+(x.review?'<span>Tekrara eklendi</span>':'')+'<button type="button" onclick="errorJournalDelete(\\''+esc(x.id)+'\\')">Sil</button></div></article>').join('');\n  };\n  document.addEventListener('DOMContentLoaded',()=>window.errorJournalRender());\n  document.addEventListener('yks:navigation-after',e=>{if(e&&e.detail&&e.detail.screen==='deneme')window.errorJournalRender();});\n})();\n`;
          write('modules/error-journal.js',journal);

          let css=read('app.css');
          if(!css.includes('Kişisel Hata Defteri')) css+=`\n\n/* Kişisel Hata Defteri */\n.error-journal{margin-bottom:24px}.error-journal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.error-journal-form textarea{width:100%;resize:vertical}.error-journal-form-actions{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:12px}.error-journal-review{display:flex;align-items:center;gap:8px;font-size:13px}.error-journal-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.error-journal-kpi{background:var(--glass);border:.5px solid var(--glass-line);border-radius:16px;padding:12px;text-align:center}.error-journal-kpi b{display:block;font-size:18px}.error-journal-kpi span{font-size:11px;color:var(--label-3)}.error-journal-tools{display:grid;grid-template-columns:1.5fr 1fr;gap:10px}.error-journal-list{display:grid;gap:10px}.error-journal-item{margin-bottom:0}.error-journal-item.is-resolved{opacity:.62}.error-journal-item-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.error-journal-item h3{font-size:16px;margin:5px 0}.error-journal-item p{margin:8px 0;color:var(--label-2);font-size:14px}.error-journal-type{font-size:11px;font-weight:750;color:var(--accent)}.error-journal-meta{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--label-3)}.error-journal-meta button{margin-left:auto;border:0;background:transparent;color:var(--danger);cursor:pointer}@media(max-width:620px){.error-journal-kpis{grid-template-columns:1fr 1fr}.error-journal-kpi:last-child{grid-column:1/-1}.error-journal-tools{grid-template-columns:1fr}.error-journal-form-actions{align-items:stretch;flex-direction:column}.error-journal-form-actions .btn{width:100%}}\n`;
          write('app.css',css);

          let test=read('tests/package.test.js');
          if(!test.includes('tek kullanıcı ve Hata Defteri')) test+=`\n\ntest("tek kullanıcı ve Hata Defteri kişisel çalışma akışına bağlı",()=>{\n  const html=fs.readFileSync(path.join(root,"index.html"),"utf8"),mod=fs.readFileSync(path.join(root,"modules/error-journal.js"),"utf8"),css=fs.readFileSync(path.join(root,"app.css"),"utf8");\n  assert.doesNotMatch(html,/Koç notları|Öğrencine not bırak|data-coach-only|data-student-only/);\n  ["errorJournal","errorJournalSubject","errorJournalTopic","errorJournalType","errorJournalList"].forEach(id=>assert.match(html,new RegExp('id="'+id+'"')));\n  assert.match(html,/modules\\/error-journal\\.js/);\n  assert.match(mod,/S\\.errorJournal/);assert.match(mod,/saveSoon/);assert.match(mod,/manualReviews/);assert.match(mod,/Bilgi eksiği/);assert.match(mod,/Dikkat/);assert.match(css,/Kişisel Hata Defteri/);\n});\n`;
          write('tests/package.test.js',test);
          NODE
      - name: Kontroller
        run: |
          node --check modules/error-journal.js
          npm run release:check
      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/personal-single-user-error-journal.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.css modules/error-journal.js tests/package.test.js .github/workflows/personal-single-user-error-journal.yml
          git diff --cached --check
          git commit -m "feat: tek kullanıcı modu ve kişisel Hata Defteri"
          git push origin HEAD:main
