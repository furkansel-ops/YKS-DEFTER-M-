name: Personal cleanup stage 2b

on:
  push:
    paths:
      - '.github/workflows/personal-cleanup-stage2b.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message == 'chore: tek kullanıcı temizliği aşama 2b' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tek kullanıcı davranışı ve gerçek Hata Defteri tekrarı
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const read=f=>fs.readFileSync(f,'utf8'),write=(f,s)=>fs.writeFileSync(f,s,'utf8');
          let app=read('app.js');
          app=app.replace('  role:"ogrenci",coachNotes:[],watched:{},lastExport:0,briefDay:"",','  watched:{},lastExport:0,briefDay:"",');
          app=app.replace(/\n  if\(!Array\.isArray\(o\.coachNotes\)\)o\.coachNotes=\[\];[\s\S]*?\.slice\(-200\);\n  delete o\.pdfs;/,'\n  delete o.role; delete o.coachNotes;\n  delete o.pdfs;');
          app=app.replace('delete o.sync; delete o.rev; delete o.revAt; delete o.coachEmail;   /* bulut eşitlemesi kaldırıldı */','delete o.sync; delete o.rev; delete o.revAt; delete o.coachEmail; delete o.role; delete o.coachNotes;   /* tek kullanıcı */');
          [
            '  if(typeof coachBlock==="function"&&coachBlock("soru kaydı"))return;\n','  if(typeof coachBlock==="function"&&coachBlock("günlük kaydı"))return;\n','  if(typeof coachBlock==="function"&&coachBlock("deneme kaydı"))return;\n','  if(typeof coachBlock==="function"&&coachBlock("pomodoro"))return;\n','  if(typeof coachBlock==="function"&&coachBlock("kronometre"))return;\n','  if(typeof isCoach==="function"&&isCoach()){ w.style.display="none"; return; }\n','  if(typeof coachBlock==="function"&&isCoach()){ toast("Koç kipinde gün ekranı yok"); return false; }\n','  if(typeof isCoach==="function"&&isCoach())return false;\n','  if(typeof isCoach==="function"&&isCoach())return;\n'
          ].forEach(g=>{app=app.split(g).join('');});
          const roleStart=app.indexOf('   ROL: ÖĞRENCİ / KOÇ');
          if(roleStart>=0){
            const commentStart=app.lastIndexOf('/* ==================================================================',roleStart),noteStart=app.indexOf('/* ==================================================================\n   KOÇ NOTLARI',roleStart);
            if(commentStart>=0&&noteStart>commentStart)app=app.slice(0,commentStart)+'/* Tek kullanıcı uyumluluk kabuğu: eski çağrılar no-op. */\nfunction isCoach(){return false;}\nfunction setRole(){return false;}\nfunction applyRole(){return false;}\nfunction coachBlock(){return false;}\n\n'+app.slice(noteStart);
          }
          if(!app.includes('manualReviews||[]).forEach(r=>')){
            const needle='const out=[];Object.keys(S.topics||{}).forEach(key=>{const t=S.topics[key];if(t.st!==3||!t.ts)return;const gi=REVIEW_GAPS.findIndex((_,i)=>!(t.rev||[]).includes(i));if(gi<0)return;const gap=REVIEW_GAPS[gi],due=addDaysKey(t.ts,gap),daysLeft=diffKeys(todayKey(),due);if(daysLeft>7)return;const p=key.split("|");out.push({key,gi,gap,due,exam:p[0]||"",subj:p[1]||"",topic:p.slice(2).join("|"),late:Math.max(0,-daysLeft),status:daysLeft<0?"overdue":daysLeft===0?"today":"upcoming"})});return out.sort((a,b)=>a.due.localeCompare(b.due));';
            const repl='const out=[];Object.keys(S.topics||{}).forEach(key=>{const t=S.topics[key];if(t.st!==3||!t.ts)return;const gi=REVIEW_GAPS.findIndex((_,i)=>!(t.rev||[]).includes(i));if(gi<0)return;const gap=REVIEW_GAPS[gi],due=addDaysKey(t.ts,gap),daysLeft=diffKeys(todayKey(),due);if(daysLeft>7)return;const p=key.split("|");out.push({key,gi,gap,due,exam:p[0]||"",subj:p[1]||"",topic:p.slice(2).join("|"),late:Math.max(0,-daysLeft),status:daysLeft<0?"overdue":daysLeft===0?"today":"upcoming"})});(S.manualReviews||[]).forEach(r=>{if(!r||r.done)return;const hit=ALL_SUBJECTS.find(s=>s.name===r.subject);out.push({key:"manual:"+r.id,gi:-1,gap:0,due:todayKey(),exam:hit?hit.exam:"",subj:r.subject||"",topic:r.topic||"",late:0,status:"today",manual:true,manualId:r.id})});return out.sort((a,b)=>a.due.localeCompare(b.due));';
            if(!app.includes(needle))throw new Error('v4UpcomingReviews gövdesi bulunamadı');
            app=app.replace(needle,repl);
          }
          app=app.split("'+r.gap+'. gün tekrarı · '").join("'+(r.manual?'Hata Defteri tekrarı':r.gap+'. gün tekrarı')+' · '");
          const doNeedle='function doReview(key,gi){const gap=REVIEW_GAPS[gi]||"";markReview(key,gi);renderReviewQueue();renderSubjects();renderHomeGoals();renderSmartInsights();if(v26TopicOpen&&v26TopicOpen.key===key)renderTopicDetail();checkBadges(false);toast((gap?gap+". gün ":"")+"tekrarı tamamlandı ✓")}';
          if(app.includes(doNeedle))app=app.replace(doNeedle,'function doReview(key,gi){if(String(key).startsWith("manual:")){const id=String(key).slice(7),r=(S.manualReviews||[]).find(x=>x&&x.id===id);if(r){r.done=true;r.doneAt=Date.now();const ej=(S.errorJournal||[]).find(x=>x&&("rev_"+x.id)===id);if(ej){ej.review=false;ej.reviewDoneAt=r.doneAt}save();}renderReviewQueue();if(typeof errorJournalRender==="function")errorJournalRender();toast("Hata Defteri tekrarı tamamlandı ✓");return}const gap=REVIEW_GAPS[gi]||"";markReview(key,gi);renderReviewQueue();renderSubjects();renderHomeGoals();renderSmartInsights();if(v26TopicOpen&&v26TopicOpen.key===key)renderTopicDetail();checkBadges(false);toast((gap?gap+". gün ":"")+"tekrarı tamamlandı ✓")}');
          write('app.js',app);

          let html=read('index.html');
          const anchor='<div id="todayReviews"></div>';
          if(html.includes(anchor)&&!html.includes('id="errorJournalToday"'))html=html.replace(anchor,anchor+'\n      <div id="errorJournalToday" class="error-journal-today"></div>');
          write('index.html',html);

          let mod=read('modules/error-journal.js');
          if(!mod.includes('function renderTodaySummary()')){
            mod=mod.replace('  window.errorJournalRender=function(){','  function renderTodaySummary(){\n    const box=field("errorJournalToday");if(!box)return;const list=state(),open=list.filter(x=>x&&!x.resolved),review=open.filter(x=>x.review);if(!open.length){box.innerHTML="";box.style.display="none";return;}const top=TYPES.map(t=>[t,open.filter(x=>x.type===t).length]).sort((a,b)=>b[1]-a[1])[0];box.style.display="block";box.innerHTML=\'<div class="today-section-head"><b>Hata Defteri</b><button type="button" onclick="go(\\\'deneme\\\');setTimeout(()=>document.getElementById(\\\'errorJournalRoot\\\')?.scrollIntoView({behavior:\\\'smooth\\\'}),80)">Aç</button></div><div class="error-journal-today-line"><b>\'+open.length+\'</b><span>aktif hata · \'+review.length+\' tekrarda · en sık: \'+esc(top&&top[1]?top[0]:"—")+\'</span></div>\';\n  }\n  window.errorJournalRender=function(){');
            mod=mod.replace("    if(!visible.length){root.innerHTML='<div class=\"card empty\">Henüz eşleşen hata kaydı yok.</div>';return;}","    renderTodaySummary();\n    if(!visible.length){root.innerHTML='<div class=\"card empty\">Henüz eşleşen hata kaydı yok.</div>';return;}");
            mod=mod.replace("    root.innerHTML=visible.map(x=>", "    renderTodaySummary();\n    root.innerHTML=visible.map(x=>");
          }
          write('modules/error-journal.js',mod);

          let css=read('app.css');
          if(!css.includes('error-journal-today-line'))css+='\n.error-journal-today{margin-top:10px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--fill)}.error-journal-today-line{display:flex;gap:8px;align-items:baseline}.error-journal-today-line b{font-size:20px}.error-journal-today-line span{font-size:13px;color:var(--label-2)}\n';
          write('app.css',css);

          for(const file of fs.readdirSync('tests').filter(x=>x.endsWith('.js'))){let t=read(path.join('tests',file));t=t.replace(/assert\.match\(css,\/body\\\.mode-coach\\\{\/\);/g,'assert.doesNotMatch(css,/body\\.mode-coach\\{/);');write(path.join('tests',file),t)}
          let test=read('tests/package.test.js');
          if(!test.includes('tek kullanıcı derin temizliği'))test+='\n\ntest("tek kullanıcı derin temizliği ve Hata Defteri gerçek tekrar entegrasyonu",()=>{\n  const app=fs.readFileSync(path.join(root,"app.js"),"utf8"),html=fs.readFileSync(path.join(root,"index.html"),"utf8"),mod=fs.readFileSync(path.join(root,"modules/error-journal.js"),"utf8"),css=fs.readFileSync(path.join(root,"app.css"),"utf8");\n  assert.doesNotMatch(app,/role:\"ogrenci\"|coachNotes:\[\]/);assert.doesNotMatch(app,/coachBlock\(\"(?:soru kaydı|günlük kaydı|deneme kaydı|pomodoro|kronometre)\"\)/);assert.match(app,/function isCoach\(\)\{return false;\}/);assert.match(app,/delete o\.role; delete o\.coachNotes/);\n  assert.match(html,/id=\"errorJournalToday\"/);assert.match(mod,/function renderTodaySummary\(\)/);assert.match(app,/manualReviews\|\|\[\]\)\.forEach/);assert.match(app,/Hata Defteri tekrarı tamamlandı/);assert.doesNotMatch(css,/body\.mode-coach\{/);\n});\n';
          write('tests/package.test.js',test);
          NODE
      - name: Kontroller
        run: npm run release:check
      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/personal-cleanup-stage2.yml .github/workflows/personal-cleanup-stage2b.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html app.css modules/error-journal.js tests .github/workflows/personal-cleanup-stage2.yml .github/workflows/personal-cleanup-stage2b.yml
          git diff --cached --check
          git commit -m "refactor: kişisel tek kullanıcı akışını derinleştir"
          git push origin HEAD:main
