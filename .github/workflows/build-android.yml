name: Android APK/AAB · GitHub Arkadaş Testi

on:
  pull_request:
    paths:
      - ".github/workflows/build-android.yml"
      - "android/**"
      - "capacitor.config.ts"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "version.json"
      - "vite.config.mts"
      - "index.html"
      - "app.js"
      - "app.css"
      - "sw.js"
      - "privacy.html"
      - "data-deletion.html"
      - "src/**"
      - "modules/**"
      - "public/**"
  workflow_dispatch:
    inputs:
      publish_github_release:
        description: "Doğrulanan APK'yı GitHub pre-release olarak yayımla"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-check:
    name: Node ${{ matrix.node }} · web release:check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node.js ${{ matrix.node }} ortamını hazırla
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Bağımlılıkları kilit dosyasından kur
        run: npm ci --no-audit --no-fund

      - name: Web sürüm kapısını doğrula
        run: npm run release:check

  android-quality:
    name: API 36 · Android lint ve unit test
    needs: web-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node.js 22 ortamını hazırla
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Java 21 ortamını hazırla
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
            android/app/*.gradle

      - name: Android SDK 36 ortamını hazırla
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Bağımlılıkları kilit dosyasından kur
        run: npm ci --no-audit --no-fund

      - name: Takip edilen Android projesini ve yayın sözleşmesini doğrula
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch -- \
            android/gradlew \
            android/gradle/wrapper/gradle-wrapper.jar \
            android/gradle/wrapper/gradle-wrapper.properties \
            android/app/build.gradle \
            android/variables.gradle >/dev/null
          npm run android:verify

      - name: Android hedef paketini üret ve projeyle eşitle
        run: npm run android:sync

      - name: Gradle wrapper, Android lint ve unit testlerini çalıştır
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --warning-mode all --version
          ./gradlew --no-daemon --warning-mode all lintRelease testReleaseUnitTest

  signed-android:
    name: API 36 · imzalı release APK/AAB
    if: github.event_name == 'workflow_dispatch'
    needs:
      - web-check
      - android-quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # Ortam adı tarihsel kalır; burada yalnız imzalama kasası olarak kullanılır.
    environment: google-play-internal
    env:
      CAPACITOR_VERSION: "8.5.0"
      BUNDLETOOL_VERSION: "1.18.3"
      BUNDLETOOL_SHA256: "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Korumalı yayın dalı güvenlik kapısı
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [ "$REF_PROTECTED" != "true" ]; then
            echo "::error::İmzalı Android paketi yalnız GitHub branch protection etkin bir yayın dalından üretilebilir."
            exit 1
          fi

      - name: Node.js 22 ortamını hazırla
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Java 21 ortamını hazırla
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
            android/app/*.gradle

      - name: Android SDK 36 ortamını hazırla
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      # Signing secret'ları bu npm adımlarına verilmez.
      - name: Bağımlılıkları kilit dosyasından kur
        run: npm ci --no-audit --no-fund

      - name: Capacitor 8.5.0 sözleşmesini doğrula
        run: |
          node -e '
            const pkg = require("./package.json");
            for (const name of ["@capacitor/core", "@capacitor/android", "@capacitor/cli"]) {
              const actual = pkg.dependencies?.[name] ?? pkg.devDependencies?.[name];
              if (actual !== process.env.CAPACITOR_VERSION) {
                throw new Error(`${name} ${actual ?? "eksik"}; ${process.env.CAPACITOR_VERSION} gerekli`);
              }
            }
          '

      - name: Takip edilen Android projesini doğrula
        shell: bash
        run: |
          set -euo pipefail
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/variables.gradle
          git ls-files --error-unmatch -- \
            android/gradlew \
            android/app/build.gradle \
            android/variables.gradle >/dev/null

      - name: Android hedef paketini üret ve takip edilen projeyle eşitle
        run: npm run android:sync

      - name: Gradle wrapper checksum'unu ve bundletool paketini doğrula
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          (cd android && ./gradlew --no-daemon --warning-mode all --version)
          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "$RUNNER_TEMP/bundletool.jar"
          printf '%s  %s\n' "$BUNDLETOOL_SHA256" "$RUNNER_TEMP/bundletool.jar" \
            | sha256sum --check --strict

      - name: İmzalama secret'larını doğrula ve upload keystore'u hazırla
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::${secret_name} secret'ı tanımlı değil."
              missing=1
            fi
          done
          test "$missing" -eq 0

          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/yks-defterim-upload.jks"
          test -s "$RUNNER_TEMP/yks-defterim-upload.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/yks-defterim-upload.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: API, sürüm ve zorunlu release imzalama ayarlarını uygula
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/yks-defterim-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/prepare-android-release.mjs

      - name: İmzalı Android APK ve App Bundle üret
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/yks-defterim-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --warning-mode all assembleRelease bundleRelease

      - name: APK/AAB, metadata ve imzalama sertifikasını doğrula
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          metadata="android/yks-release-metadata.json"
          keystore="$RUNNER_TEMP/yks-defterim-upload.jks"
          aab_manifest="$RUNNER_TEMP/aab-manifest.xml"
          apk_badging="$RUNNER_TEMP/apk-badging.txt"

          test -s "$apk"
          test -s "$aab"
          test -s "$metadata"
          unzip -t "$apk" >/dev/null
          unzip -t "$aab" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$apk" >/dev/null
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$aab" >/dev/null
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest \
            --bundle="$aab" --module=base > "$aab_manifest"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" > "$apk_badging"
          test -s "$aab_manifest"
          test -s "$apk_badging"
          if grep -q '^application-debuggable' "$apk_badging"; then
            echo "::error::Release APK debug olarak işaretlenmiş."
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const metadata = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const manifest = fs.readFileSync(process.argv[2], "utf8");
            const badging = fs.readFileSync(process.argv[3], "utf8");
            const release = JSON.parse(fs.readFileSync("version.json", "utf8"));
            const [major, minor, patch] = release.version.split(".").map(Number);
            const revision = Number(String(release.build).match(/-r(\d+)$/)?.[1] ?? 1);
            const expectedVersionCode = major * 1_000_000 + minor * 10_000 + patch * 100 + revision;
            if (metadata.signed !== true) throw new Error("Android release paketi imzasız olarak işaretlenmiş");
            if (metadata.appId !== "com.furkansel.yksdefterim") throw new Error("applicationId uyuşmuyor");
            if (release.version !== "4.4.0" || metadata.versionName !== release.version) {
              throw new Error("versionName uyuşmuyor");
            }
            if (metadata.compileSdk !== 36 || metadata.targetSdk !== 36 || metadata.minSdk !== 24) {
              throw new Error("Android SDK sözleşmesi uyuşmuyor");
            }
            if (!Number.isInteger(expectedVersionCode) || metadata.versionCode !== expectedVersionCode) {
              throw new Error(`versionCode uyuşmuyor: ${metadata.versionCode} != ${expectedVersionCode}`);
            }
            for (const [pattern, label] of [
              [/package="com\.furkansel\.yksdefterim"/, "AAB applicationId"],
              [/versionName="4\.4\.0"/, "AAB versionName"],
              [/versionCode="4040002"/, "AAB versionCode"],
              [/minSdkVersion="24"/, "AAB minSdk"],
              [/targetSdkVersion="36"/, "AAB targetSdk"],
              [/usesCleartextTraffic="false"/, "AAB cleartext"],
              [/allowBackup="false"/, "AAB backup"]
            ]) if (!pattern.test(manifest)) throw new Error(`${label} doğrulanamadı`);
            if (/android\.intent\.category\.BROWSABLE|android\.intent\.action\.VIEW/.test(manifest)) {
              throw new Error("Beklenmeyen deep-link intent-filter bulundu");
            }
            for (const [pattern, label] of [
              [/package: name='com\.furkansel\.yksdefterim'/, "APK applicationId"],
              [/versionCode='4040002'/, "APK versionCode"],
              [/versionName='4\.4\.0'/, "APK versionName"],
              [/sdkVersion:'24'/, "APK minSdk"],
              [/targetSdkVersion:'36'/, "APK targetSdk"],
              [/application-label:'YKS Defterim'/, "APK uygulama adı"]
            ]) if (!pattern.test(badging)) throw new Error(`${label} doğrulanamadı`);
          ' "$metadata" "$aab_manifest" "$apk_badging"

          jarsigner -verify "$aab" \
            | tee "$RUNNER_TEMP/jarsigner-verify.txt"
          grep -q '^jar verified\.$' "$RUNNER_TEMP/jarsigner-verify.txt"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify \
            --verbose --print-certs --min-sdk-version 24 -Werr "$apk" \
            > "$RUNNER_TEMP/apksigner-verify.txt"

          keytool -list -v \
            -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            > "$RUNNER_TEMP/upload-key.txt"
          keytool -printcert -jarfile "$aab" \
            > "$RUNNER_TEMP/aab-cert.txt"
          expected_fingerprint="$(awk '/SHA256:/{print $2; exit}' "$RUNNER_TEMP/upload-key.txt")"
          actual_aab_fingerprint="$(awk '/SHA256:/{print $2; exit}' "$RUNNER_TEMP/aab-cert.txt")"
          actual_apk_fingerprint="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' "$RUNNER_TEMP/apksigner-verify.txt")"
          expected_normalized="$(printf '%s' "$expected_fingerprint" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          actual_apk_normalized="$(printf '%s' "$actual_apk_fingerprint" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$expected_fingerprint"
          test "$actual_aab_fingerprint" = "$expected_fingerprint"
          test -n "$actual_apk_fingerprint"
          test "$actual_apk_normalized" = "$expected_normalized"

          artifact_dir="$RUNNER_TEMP/github-test-artifact"
          version_name="$(node -p "require('./android/yks-release-metadata.json').versionName")"
          version_code="$(node -p "require('./android/yks-release-metadata.json').versionCode")"
          apk_name="YKS-Defterim-${version_name}-${version_code}.apk"
          aab_name="YKS-Defterim-${version_name}-${version_code}.aab"
          mkdir -p "$artifact_dir"
          cp "$apk" "$artifact_dir/$apk_name"
          cp "$aab" "$artifact_dir/$aab_name"
          cp "$aab_manifest" "$artifact_dir/AndroidManifest.xml"
          cp "$apk_badging" "$artifact_dir/APK-badging.txt"
          apk_sha256="$(sha256sum "$apk" | awk '{print $1}')"
          aab_sha256="$(sha256sum "$aab" | awk '{print $1}')"
          node -e '
            const fs = require("node:fs");
            const source = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            Object.assign(source, {
              artifactType: "apk",
              artifactFile: process.argv[3],
              sha256: process.argv[4],
              signingCertificateSha256: process.argv[5],
              sourceCommit: process.argv[6],
              archiveAabFile: process.argv[7],
              archiveAabSha256: process.argv[8]
            });
            fs.writeFileSync(process.argv[2], `${JSON.stringify(source, null, 2)}\n`);
          ' "$metadata" "$artifact_dir/release-metadata.json" \
            "$apk_name" "$apk_sha256" "$expected_normalized" "$GITHUB_SHA" \
            "$aab_name" "$aab_sha256"
          (cd "$artifact_dir" && sha256sum "$apk_name" > "$apk_name.sha256")
          (cd "$artifact_dir" && sha256sum "$aab_name" > "$aab_name.sha256")
          echo "APK/AAB doğrulandı: APK $(du -h "$apk" | cut -f1), AAB $(du -h "$aab" | cut -f1); imzalama sertifikası eşleşti."

      - name: GitHub arkadaş testi APK/AAB artefaktını yükle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yks-defterim-github-test-package
          path: ${{ runner.temp }}/github-test-artifact/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Geçici imzalama dosyalarını temizle
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/yks-defterim-upload.jks" \
            "$RUNNER_TEMP/jarsigner-verify.txt" \
            "$RUNNER_TEMP/apksigner-verify.txt" \
            "$RUNNER_TEMP/upload-key.txt" \
            "$RUNNER_TEMP/aab-cert.txt" \
            "$RUNNER_TEMP/aab-manifest.xml" \
            "$RUNNER_TEMP/apk-badging.txt" \
            "$RUNNER_TEMP/bundletool.jar"
          rm -rf "$RUNNER_TEMP/github-test-artifact"

  publish-github-release:
    name: GitHub · doğrulanmış test APK'sını yayımla
    if: github.event_name == 'workflow_dispatch' && inputs.publish_github_release == true
    needs: signed-android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Doğrulanmış Android paketini indir
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: yks-defterim-github-test-package
          path: release-package

      - name: Release girdilerini ve kaynak commitini doğrula
        shell: bash
        run: |
          set -euo pipefail
          package_dir="release-package"
          metadata="$package_dir/release-metadata.json"
          apk_name="$(node -p "require('./release-package/release-metadata.json').artifactFile")"
          if [[ "$apk_name" == */* || "$apk_name" == *\\* ]]; then
            echo "::error::APK metadata dosya adı güvenli değil."
            exit 1
          fi
          apk="$package_dir/$apk_name"
          checksum="$apk.sha256"
          test -s "$apk"
          test -s "$checksum"
          test -s "$metadata"
          (cd "$package_dir" && sha256sum --check "$(basename "$checksum")")
          node -e '
            const crypto = require("node:crypto");
            const fs = require("node:fs");
            const metadata = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const expected = {
              appId: "com.furkansel.yksdefterim",
              versionName: "4.4.0",
              versionCode: 4040002,
              build: "4.4.0-r2",
              signed: true,
              artifactType: "apk",
              artifactFile: "YKS-Defterim-4.4.0-4040002.apk",
              sourceCommit: process.env.GITHUB_SHA
            };
            for (const [key, value] of Object.entries(expected)) {
              if (metadata[key] !== value) throw new Error(`${key} uyuşmuyor`);
            }
            if (!/^[a-f0-9]{64}$/.test(metadata.sha256)) throw new Error("APK SHA-256 metadata değeri geçersiz");
            if (!/^[a-f0-9]{64}$/.test(metadata.signingCertificateSha256)) throw new Error("İmza sertifikası özeti geçersiz");
            const actualSha256 = crypto.createHash("sha256").update(fs.readFileSync(process.argv[2])).digest("hex");
            if (metadata.sha256 !== actualSha256) throw new Error("Metadata APK SHA-256 ile gerçek dosya uyuşmuyor");
          ' "$metadata" "$apk"

      - name: GitHub pre-release oluştur
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          package_dir="release-package"
          metadata="$package_dir/release-metadata.json"
          apk_name="$(node -p "require('./release-package/release-metadata.json').artifactFile")"
          build="$(node -p "require('./release-package/release-metadata.json').build")"
          apk="$package_dir/$apk_name"
          checksum="$apk.sha256"
          tag="v${build}"
          title="YKS Defterim ${build} — Android Test APK"
          notes="$RUNNER_TEMP/github-release-notes.md"

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error::$tag etiketi zaten var; var olan yayın otomatik olarak değiştirilmedi."
            exit 1
          fi

          node -e '
            const fs = require("node:fs");
            const metadata = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const notes = [
              "Bu sürüm Google Play yayını değil, bir yıllık arkadaş testi için doğrudan kurulabilir Android APK paketidir.",
              "",
              "## Kurulum",
              "",
              "- `YKS-Defterim-4.4.0-4040002.apk` dosyasını indirin ve Android cihazda açın.",
              "- Minimum Android sürümü: Android 7.0 (API 24).",
              "- Güncellemeden önce uygulamadaki **Daha → Veri** bölümünden yedek alın.",
              "- Dosyayı yalnız bu resmî GitHub Release sayfasından indirin.",
              "",
              "## Doğrulama",
              "",
              `- Paket: \`${metadata.appId}\``,
              `- Sürüm: \`${metadata.versionName}\` (\`${metadata.versionCode}\`)`,
              `- Kaynak commit: \`${metadata.sourceCommit}\``,
              `- APK SHA-256: \`${metadata.sha256}\``,
              "",
              "Bu depo herkese açıksa dosya yalnız davet edilen arkadaşlarla sınırlı değildir; bağlantıya erişen herkes indirebilir."
            ].join("\n");
            fs.writeFileSync(process.argv[2], `${notes}\n`);
          ' "$metadata" "$notes"

          gh release create "$tag" \
            "$apk" \
            "$checksum" \
            "$metadata" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file "$notes" \
            --prerelease \
            --latest=false
