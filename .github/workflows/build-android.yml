name: Android AAB · Google Play Internal Testing

on:
  pull_request:
    paths:
      - ".github/workflows/build-android.yml"
      - "android/**"
      - "capacitor.config.ts"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "version.json"
      - "vite.config.mts"
      - "vite.runtime-hardening.mts"
      - "index.html"
      - "app.js"
      - "app.css"
      - "sw.js"
      - "privacy.html"
      - "data-deletion.html"
      - "src/**"
      - "modules/**"
      - "public/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-aab-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-check:
    name: Node ${{ matrix.node }} · web release:check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22
          - 24
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node.js ${{ matrix.node }} ortamını hazırla
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Bağımlılıkları kilit dosyasından kur
        run: npm ci --no-audit --no-fund

      - name: Web sürüm kapısını doğrula
        run: npm run release:check

  android-quality:
    name: API 36 · Android lint ve unit test
    needs: web-check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node.js 22 ortamını hazırla
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Java 21 ortamını hazırla
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
            android/app/*.gradle

      - name: Android SDK 36 ortamını hazırla
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0 emulator system-images;android-36;google_apis;x86_64"

      - name: Bağımlılıkları kilit dosyasından kur
        run: npm ci --no-audit --no-fund

      - name: Takip edilen Android projesini ve yayın sözleşmesini doğrula
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch -- \
            android/gradlew \
            android/gradle/wrapper/gradle-wrapper.jar \
            android/gradle/wrapper/gradle-wrapper.properties \
            android/app/build.gradle \
            android/variables.gradle >/dev/null
          npm run android:verify

      - name: Web paketini üret ve Android projesiyle eşitle
        run: |
          npm run build:assets
          npx cap sync android

      - name: Gradle wrapper, Android lint, unit testleri ve deneme APK'sını üret
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --warning-mode all --version
          ./gradlew --no-daemon --warning-mode all lintRelease testReleaseUnitTest assembleDebug :app:assembleDebugAndroidTest

      - name: Android 16 üzerinde gerçek bildirim ve WebView testlerini çalıştır
        timeout-minutes: 15
        working-directory: android
        shell: bash
        env:
          ANDROID_SERIAL: emulator-5554
          ANDROID_AVD_HOME: ${{ runner.temp }}/android-runtime/avd
          ANDROID_USER_HOME: ${{ runner.temp }}/android-runtime/user
          ANDROID_EMULATOR_HOME: ${{ runner.temp }}/android-runtime/user
        run: |
          set -euo pipefail
          runtime_dir="$RUNNER_TEMP/android-runtime"
          mkdir -p "$runtime_dir" "$ANDROID_AVD_HOME" "$ANDROID_USER_HOME"
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check
          adb start-server
          printf 'no\n' | avdmanager create avd \
            --name yks-api36-review \
            --package "system-images;android-36;google_apis;x86_64" \
            --device pixel_6 \
            --path "$ANDROID_AVD_HOME/yks-api36-review.avd"
          test -s "$ANDROID_AVD_HOME/yks-api36-review.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-36\n' \
            "$ANDROID_AVD_HOME/yks-api36-review.avd" \
            > "$ANDROID_AVD_HOME/yks-api36-review.ini"
          "$ANDROID_HOME/emulator/emulator" -avd yks-api36-review \
            -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim \
            -no-metrics -gpu swiftshader -memory 2048 -cores 2 \
            -camera-back none -camera-front none \
            > "$runtime_dir/emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup() {
            timeout 20s adb -s "$ANDROID_SERIAL" logcat -d -v threadtime \
              > "$runtime_dir/logcat.txt" 2>&1 || true
            timeout 10s adb -s "$ANDROID_SERIAL" emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          booted=false
          deadline=$((SECONDS + 240))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "::error::Android emülatörü açılış sırasında kapandı."
              tail -n 60 "$runtime_dir/emulator.log"
              exit 1
            fi
            boot_state="$(timeout 10s adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$boot_state" = "1" ]; then
              booted=true
              break
            fi
            sleep 3
          done
          if [ "$booted" != true ]; then
            echo "::error::Android 16 emülatörü 240 saniyede hazır olmadı."
            tail -n 60 "$runtime_dir/emulator.log"
            exit 1
          fi
          adb -s "$ANDROID_SERIAL" shell input keyevent 82
          adb -s "$ANDROID_SERIAL" shell settings put global window_animation_scale 0
          adb -s "$ANDROID_SERIAL" shell settings put global transition_animation_scale 0
          adb -s "$ANDROID_SERIAL" shell settings put global animator_duration_scale 0
          timeout --signal=TERM 10m ./gradlew --no-daemon --warning-mode all \
            :app:connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.furkansel.yksdefterim.FocusNotificationsInstrumentedTest

      - name: Android çalışma zamanı test raporlarını yükle
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yks-android-runtime-${{ github.event.pull_request.number || github.run_number }}
          path: |
            android/app/build/reports/androidTests/connected/**
            android/app/build/outputs/androidTest-results/connected/**
            ${{ runner.temp }}/android-runtime/*.log
            ${{ runner.temp }}/android-runtime/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Deneme APK'sını ve kaynak kimliğini doğrula
        shell: bash
        env:
          REVIEW_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REVIEW_BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/debug/app-debug.apk"
          artifact_dir="$RUNNER_TEMP/native-review-artifact"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          mkdir -p "$artifact_dir"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" \
            > "$artifact_dir/apk-signature.txt"
          "$build_tools/aapt" dump badging "$apk" > "$artifact_dir/apk-badging.txt"
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const dir = process.argv[1];
            const metadata = JSON.parse(fs.readFileSync("android/app/build/outputs/apk/debug/output-metadata.json", "utf8"));
            const release = JSON.parse(fs.readFileSync("version.json", "utf8"));
            const badging = fs.readFileSync(path.join(dir, "apk-badging.txt"), "utf8");
            const apk = metadata.elements?.find(item => item.outputFile === "app-debug.apk");
            if (metadata.applicationId !== "com.furkansel.yksdefterim" || metadata.variantName !== "debug" || !apk) {
              throw new Error("Beklenen debug APK kimliği doğrulanamadı");
            }
            if (!badging.includes("application-debuggable")) throw new Error("Deneme APK debug olarak işaretlenmemiş");
            if (!badging.includes("targetSdkVersion:\u002736\u0027")) throw new Error("APK target SDK 36 değil");
            if (!badging.includes("sdkVersion:\u002724\u0027")) throw new Error("APK min SDK 24 değil");
            fs.writeFileSync(path.join(dir, "review-metadata.json"), JSON.stringify({
              purpose: "Physical-device review only; not a Play release",
              applicationId: metadata.applicationId,
              variant: metadata.variantName,
              versionCode: apk.versionCode,
              versionName: apk.versionName,
              webBuild: release.build,
              sourceCommit: process.env.REVIEW_SOURCE_SHA,
              testedCheckout: process.env.REVIEW_BUILD_SHA,
              signing: "Android debug key; no release signing secrets used"
            }, null, 2) + "\n");
          ' "$artifact_dir"
          cp "$apk" "$artifact_dir/YKS-Defterim-native-review.apk"
          cp docs/native-focus-notifications.md "$artifact_dir/TEST-ADIMLARI.md"
          (cd "$artifact_dir" && sha256sum YKS-Defterim-native-review.apk > YKS-Defterim-native-review.apk.sha256)

      - name: Fiziksel cihaz denemesi için APK artefaktını yükle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yks-defterim-native-review-${{ github.event.pull_request.number || github.run_number }}
          path: ${{ runner.temp }}/native-review-artifact/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  signed-aab:
    name: API 36 · imzalı release AAB
    if: github.event_name == 'workflow_dispatch'
    needs:
      - web-check
      - android-quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: google-play-internal
    env:
      CAPACITOR_VERSION: "8.5.2"
      BUNDLETOOL_VERSION: "1.18.3"
      BUNDLETOOL_SHA256: "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29"
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Korumalı yayın dalı güvenlik kapısı
        shell: bash
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [ "$REF_PROTECTED" != "true" ]; then
            echo "::error::İmzalı AAB yalnız GitHub branch protection etkin bir yayın dalından üretilebilir."
            exit 1
          fi

      - name: Node.js 22 ortamını hazırla
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Java 21 ortamını hazırla
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties
            android/app/*.gradle

      - name: Android SDK 36 ortamını hazırla
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      # Signing secret'ları bu npm adımlarına verilmez.
      - name: Bağımlılıkları kilit dosyasından kur
        run: npm ci --no-audit --no-fund

      - name: Capacitor sürüm sözleşmesini doğrula
        run: |
          node -e '
            const pkg = require("./package.json");
            for (const name of ["@capacitor/core", "@capacitor/android", "@capacitor/cli"]) {
              const actual = pkg.dependencies?.[name] ?? pkg.devDependencies?.[name];
              if (actual !== process.env.CAPACITOR_VERSION) {
                throw new Error(`${name} ${actual ?? "eksik"}; ${process.env.CAPACITOR_VERSION} gerekli`);
              }
            }
          '

      - name: Takip edilen Android projesini doğrula
        shell: bash
        run: |
          set -euo pipefail
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/variables.gradle
          git ls-files --error-unmatch -- \
            android/gradlew \
            android/app/build.gradle \
            android/variables.gradle >/dev/null

      - name: Web paketini üret ve takip edilen Android projesiyle eşitle
        run: |
          npm run build:assets
          npx cap sync android

      - name: Gradle wrapper checksum'unu ve bundletool paketini doğrula
        shell: bash
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          (cd android && ./gradlew --no-daemon --warning-mode all --version)
          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar" \
            --output "$RUNNER_TEMP/bundletool.jar"
          printf '%s  %s\n' "$BUNDLETOOL_SHA256" "$RUNNER_TEMP/bundletool.jar" \
            | sha256sum --check --strict

      - name: İmzalama secret'larını doğrula ve upload keystore'u hazırla
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::${secret_name} secret'ı tanımlı değil."
              missing=1
            fi
          done
          test "$missing" -eq 0

          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/yks-defterim-upload.jks"
          test -s "$RUNNER_TEMP/yks-defterim-upload.jks"
          keytool -list \
            -keystore "$RUNNER_TEMP/yks-defterim-upload.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: API, sürüm ve zorunlu release imzalama ayarlarını uygula
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/yks-defterim-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/prepare-android-release.mjs

      - name: İmzalı Android App Bundle üret
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/yks-defterim-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --warning-mode all bundleRelease

      - name: AAB, metadata ve imzalama sertifikasını doğrula
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          aab="android/app/build/outputs/bundle/release/app-release.aab"
          metadata="android/yks-release-metadata.json"
          keystore="$RUNNER_TEMP/yks-defterim-upload.jks"
          manifest="$RUNNER_TEMP/aab-manifest.xml"

          test -s "$aab"
          test -s "$metadata"
          unzip -t "$aab" >/dev/null
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="$aab" >/dev/null
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest \
            --bundle="$aab" --module=base > "$manifest"
          test -s "$manifest"
          node -e '
            const fs = require("node:fs");
            const metadata = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            const manifest = fs.readFileSync(process.argv[2], "utf8");
            const release = JSON.parse(fs.readFileSync("version.json", "utf8"));
            const [major, minor, patch] = release.version.split(".").map(Number);
            const revision = Number(String(release.build).match(/-r(\d+)$/)?.[1] ?? 1);
            const expectedVersionCode = major * 1_000_000 + minor * 10_000 + patch * 100 + revision;
            if (metadata.signed !== true) throw new Error("Play AAB imzasız olarak işaretlenmiş");
            if (metadata.appId !== "com.furkansel.yksdefterim") throw new Error("applicationId uyuşmuyor");
            if (release.version !== "4.4.0" || metadata.versionName !== release.version) {
              throw new Error("versionName uyuşmuyor");
            }
            if (metadata.compileSdk !== 36 || metadata.targetSdk !== 36 || metadata.minSdk !== 24) {
              throw new Error("Android SDK sözleşmesi uyuşmuyor");
            }
            if (!Number.isInteger(expectedVersionCode) || metadata.versionCode !== expectedVersionCode) {
              throw new Error(`versionCode uyuşmuyor: ${metadata.versionCode} != ${expectedVersionCode}`);
            }
            if (!manifest.includes(`versionName="${metadata.versionName}"`)) throw new Error("AAB versionName doğrulanamadı");
            if (!manifest.includes(`versionCode="${metadata.versionCode}"`)) throw new Error("AAB versionCode doğrulanamadı");
            for (const [pattern, label] of [
              [/package="com\.furkansel\.yksdefterim"/, "AAB applicationId"],
              [/minSdkVersion="24"/, "AAB minSdk"],
              [/targetSdkVersion="36"/, "AAB targetSdk"],
              [/usesCleartextTraffic="false"/, "AAB cleartext"],
              [/allowBackup="false"/, "AAB backup"]
            ]) if (!pattern.test(manifest)) throw new Error(`${label} doğrulanamadı`);
            if (/android\.intent\.category\.BROWSABLE|android\.intent\.action\.VIEW/.test(manifest)) {
              throw new Error("Beklenmeyen deep-link intent-filter bulundu");
            }
          ' "$metadata" "$manifest"

          jarsigner -verify "$aab" \
            | tee "$RUNNER_TEMP/jarsigner-verify.txt"
          grep -q '^jar verified\.$' "$RUNNER_TEMP/jarsigner-verify.txt"

          keytool -list -v \
            -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            > "$RUNNER_TEMP/upload-key.txt"
          keytool -printcert -jarfile "$aab" \
            > "$RUNNER_TEMP/aab-cert.txt"
          expected_fingerprint="$(awk '/SHA256:/{print $2; exit}' "$RUNNER_TEMP/upload-key.txt")"
          actual_fingerprint="$(awk '/SHA256:/{print $2; exit}' "$RUNNER_TEMP/aab-cert.txt")"
          test -n "$expected_fingerprint"
          test "$actual_fingerprint" = "$expected_fingerprint"

          artifact_dir="$RUNNER_TEMP/play-internal-artifact"
          artifact_name="$(node -e 'const fs=require("node:fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(`YKS-Defterim-${m.versionName}-${m.versionCode}.aab`)' "$metadata")"
          mkdir -p "$artifact_dir"
          cp "$aab" "$artifact_dir/$artifact_name"
          cp "$metadata" "$artifact_dir/release-metadata.json"
          cp "$manifest" "$artifact_dir/AndroidManifest.xml"
          (cd "$artifact_dir" && sha256sum "$artifact_name" > "$artifact_name.sha256")
          echo "AAB doğrulandı: $(du -h "$aab" | cut -f1), upload sertifikası eşleşti."

      - name: Play Internal Testing AAB artefaktını yükle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: yks-defterim-play-internal-aab
          path: ${{ runner.temp }}/play-internal-artifact/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Geçici imzalama dosyalarını temizle
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/yks-defterim-upload.jks" \
            "$RUNNER_TEMP/jarsigner-verify.txt" \
            "$RUNNER_TEMP/upload-key.txt" \
            "$RUNNER_TEMP/aab-cert.txt" \
            "$RUNNER_TEMP/aab-manifest.xml" \
            "$RUNNER_TEMP/bundletool.jar"
          rm -rf "$RUNNER_TEMP/play-internal-artifact"
