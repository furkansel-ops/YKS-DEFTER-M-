name: Öğrenme Laboratuvarı v2 rollup
on:
  push:
    paths:
      - '.github/workflows/learning-lab-v2-rollup.yml'
permissions:
  contents: write
jobs:
  rollup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Laboratuvar v2 dosyalarını sağlamlaştır
        shell: python
        run: |
          from pathlib import Path
          p=Path('modules/learning-lab-v2.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('{"&":"&amp;","<":"&lt;","&gt;":">",\'"\':"&quot;","\'":"&#39;"}', '{"&":"&amp;","<":"&lt;",">":"&gt;",\'"\':"&quot;","\'":"&#39;"}')
          s=s.replace('bekliyor?\n","Seçeneğin', 'bekliyor?","Seçeneğin')
          p.write_text(s,encoding='utf-8')

          p=Path('modules/stability.js'); s=p.read_text(encoding='utf-8')
          old='function loadProgressV2(){loadScriptOnce("./modules/progress-v2.js?v=4.1.0-r20","data-yks-progress-v2","__YKS_PROGRESS_V2__","progress-v2-load");}'
          new=old+'\n  function loadLearningLabV2(){loadScriptOnce("./modules/learning-lab-v2.js?v=4.1.0-r20","data-yks-learning-lab-v2","__YKS_LEARNING_LAB_V2__","learning-lab-v2-load");}'
          if 'loadLearningLabV2' not in s:
            s=s.replace(old,new)
            s=s.replace('loadPersonalUpgrades();loadProgressV2();setTimeout(restoreRuntime,180);','loadPersonalUpgrades();loadProgressV2();loadLearningLabV2();setTimeout(restoreRuntime,180);')
            s=s.replace('loadPersonalUpgrades,loadProgressV2};','loadPersonalUpgrades,loadProgressV2,loadLearningLabV2};')
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          needle='"./modules/learning-lab.js?v=4.1.0-r20"'
          add=needle+',"./modules/learning-lab-v2.js?v=4.1.0-r20"'
          if 'learning-lab-v2.js?v=4.1.0-r20' not in s:s=s.replace(needle,add)
          p.write_text(s,encoding='utf-8')

          p=Path('scripts/verify-dist.mjs'); s=p.read_text(encoding='utf-8')
          if 'modules/learning-lab-v2.js' not in s:
            s=s.replace('"modules/learning-lab.js","modules/target-center.js"','"modules/learning-lab.js","modules/learning-lab-v2.js","modules/target-center.js"')
            s=s.replace('const [bundle,app,sw,versionText,recovery,stability,personal,progress]=await Promise.all([','const [bundle,app,sw,versionText,recovery,stability,personal,progress,labV2]=await Promise.all([')
            s=s.replace('readFile(resolve(dist,"modules/progress-v2.js"),"utf8")\n]);','readFile(resolve(dist,"modules/progress-v2.js"),"utf8"),\n  readFile(resolve(dist,"modules/learning-lab-v2.js"),"utf8")\n]);')
            s=s.replace('["error-journal.js?v=4.1.0-r20","personal-upgrades.js?v=4.1.0-r20","progress-v2.js?v=4.1.0-r20"]','["error-journal.js?v=4.1.0-r20","personal-upgrades.js?v=4.1.0-r20","progress-v2.js?v=4.1.0-r20","learning-lab-v2.js?v=4.1.0-r20"]')
            s=s.replace('if(!stability.includes("personal-upgrades.js?v=4.1.0-r20")||!stability.includes("progress-v2.js?v=4.1.0-r20"))','if(!stability.includes("personal-upgrades.js?v=4.1.0-r20")||!stability.includes("progress-v2.js?v=4.1.0-r20")||!stability.includes("learning-lab-v2.js?v=4.1.0-r20"))')
            s=s.replace('if(!progress.includes("studyNetRelation")||!progress.includes("bestImprovingSubject"))throw new Error("İlerleme v2 üretim paketinde eksik");','if(!progress.includes("studyNetRelation")||!progress.includes("bestImprovingSubject"))throw new Error("İlerleme v2 üretim paketinde eksik");\nif(!labV2.includes("PARAGRAPH_TIPS")||!labV2.includes("fetchElementMedia")||!labV2.includes("DEEP_DIVES")||!labV2.includes("ERA_CARDS"))throw new Error("Öğrenme Laboratuvarı v2 üretim paketinde eksik");')
          p.write_text(s,encoding='utf-8')
      - name: Laboratuvar v2 regresyon testini ekle
        shell: bash
        run: |
          cat > tests/learning-lab-v2.test.js <<'EOF'
          const test=require('node:test');
          const assert=require('node:assert/strict');
          const fs=require('node:fs');
          const path=require('node:path');
          const root=path.resolve(__dirname,'..');
          test('Öğrenme Laboratuvarı v2 Türkçe, periyodik, tarih ve ders atlasını paketler',()=>{
            const file=path.join(root,'modules/learning-lab-v2.js');
            assert.equal(fs.existsSync(file),true);
            const s=fs.readFileSync(file,'utf8'),stability=fs.readFileSync(path.join(root,'modules/stability.js'),'utf8'),sw=fs.readFileSync(path.join(root,'sw.js'),'utf8');
            assert.match(s,/const WORDS=\[/);assert.match(s,/yadsımak/);assert.match(s,/kanıksamak/);assert.match(s,/PARAGRAPH_TIPS/);assert.match(s,/Ana düşünce/);assert.match(s,/Cümle yerleştirme/);
            assert.match(s,/fetchElementMedia/);assert.match(s,/w\/api\.php/);assert.match(s,/Wikimedia/);assert.match(s,/Periyodik eğilim/);
            assert.match(s,/ERA_CARDS/);assert.match(s,/Milli Mücadele/);assert.match(s,/DEEP_DIVES/);assert.match(s,/Kalp/);assert.match(s,/Böbrek/);assert.match(s,/Dalak/);assert.match(s,/Fizik/);assert.match(s,/Kimya/);
            assert.match(s,/YKSTopicGuides/);assert.match(s,/curriculum/);assert.match(stability,/learning-lab-v2\.js\?v=4\.1\.0-r20/);assert.match(sw,/learning-lab-v2\.js\?v=4\.1\.0-r20/);
          });
          EOF
      - name: Sözdizimi ve kararlı sürüm denetimi
        run: |
          node --check modules/learning-lab-v2.js
          npm ci
          npm run release:check
      - name: Sonucu main dalına işle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/learning-lab-v2-rollup.yml
          git add modules/learning-lab-v2.js modules/stability.js sw.js scripts/verify-dist.mjs tests/learning-lab-v2.test.js
          git commit -m "feat: Öğrenme Laboratuvarı v2 tamamla"
          git push origin HEAD:main
