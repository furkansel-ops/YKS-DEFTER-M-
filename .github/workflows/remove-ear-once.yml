name: Remove ear atlas once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-ear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Remove ear atlas code and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding='utf-8')
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          def replace(path, old, new, expected=1):
              text=read(path)
              count=text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences, found {count}: {old[:90]!r}')
              write(path, text.replace(old,new))
          def sub(path, pattern, repl, expected=1, flags=0):
              text=read(path)
              text2,count=re.subn(pattern,repl,text,flags=flags)
              if count != expected:
                  raise SystemExit(f'{path}: regex expected {expected}, found {count}: {pattern}')
              write(path,text2)

          # Core atlas data: remove ear as a selectable/downloadable organ while
          # retaining the curriculum's normal hearing/balance lesson text.
          replace('src/data/biology-atlas.ts',' | "ear"','')
          sub('src/data/biology-atlas.ts',r'\n  \{id:"ear",name:"Kulak"[^\n]*\},','')
          replace('src/data/biology-atlas.ts','models:["eyeball","ear","skin"]','models:["eyeball","skin"]')

          # Ear-only organ teaching data.
          sub('src/data/biology-organs.ts',r'\n  ear:\{.*?\n  \]\},\n  skin:\{','\n  skin:{',flags=re.S)
          sub('src/data/biology-organ-landmarks.ts',r'^  ear:\{[^\n]*\},\n','',flags=re.M)
          sub('src/ui/biology-organ-interiors.ts',r'\n    case "ear": \{.*?\n    \}\n    case "skin": \{','\n    case "skin": {',flags=re.S)
          sub('src/ui/biology-organ-diagrams.ts',r'\n  ear:`.*?\n  skin:`','\n  skin:`',flags=re.S)
          replace('src/ui/biology-organ-diagrams.ts','const canOpen=id==="heart"||id==="brain"||id==="ear";','const canOpen=id==="heart"||id==="brain";')

          # Remove ear-only camera/badge special cases.
          replace('src/ui/biology-atlas-model.ts','if(model)model.rotation.set(organ.id==="ear"?-.035:0,organ.id==="ear"?.035:-.2,0);','if(model)model.rotation.set(0,-.2,0);')
          replace('src/ui/biology-atlas-model.ts','model=assembly.root;model.rotation.set(organ.id==="ear"?-.035:0,organ.id==="ear"?.035:-.2,0);','model=assembly.root;model.rotation.set(0,-.2,0);')
          replace('src/ui/biology-atlas.ts','if(badge)badge.textContent=organOpen?"3B İÇ YAPI · DÖNDÜREREK İNCELE":organId==="ear"?"3B ANATOMİK KESİT · YKS ETİKETLERİ":"3B DIŞ YÜZEY · YKS ETİKETLERİ";','if(badge)badge.textContent=organOpen?"3B İÇ YAPI · DÖNDÜREREK İNCELE":"3B DIŞ YÜZEY · YKS ETİKETLERİ";')

          # Distribution verification no longer expects the custom ear binary.
          replace('scripts/verify-dist.mjs','import {verifyAnatomyAssets,inspectAnatomyGlb} from "./verify-anatomy-assets.mjs";','import {verifyAnatomyAssets} from "./verify-anatomy-assets.mjs";')
          sub('scripts/verify-dist.mjs',r'\nconst earBytes=await readFile\(resolve\(dist,"anatomy/models/ear\.glb"\)\),earData=inspectAnatomyGlb\(earBytes\),earNames=new Set\(\(earData\.nodes\|\|\[\]\)\.map\(node=>node\.name\)\);\nif\(earBytes\.length<1400000\|\|earBytes\.length>2200000\|\|!earNames\.has\("outer_ear_main"\)\|\|!earNames\.has\("cochlea"\)\|\|!earNames\.has\("auditory_nerve_main"\)\)throw new Error\("Özel 3B kulak modeli üretim paketinde eksik veya bozuk"\);','')

          # Tests: 10 organs/60 structures -> 9 organs/52 structures.
          replace('tests/biology-atlas-3d.test.js','}assert.equal(count,60);','}assert.equal(count,52);')
          sub('tests/biology-atlas-3d.test.js',r'\ntest\(\'Kulak referans paketi.*?\n\}\);\n\n(?=test\(\'Kalp boşlukları)', '', flags=re.S)

          replace('tests/biology-atlas.test.js','Atlas 24 benzersiz konu, 5 grup ve izinli 10 organla tutarlı bağlantılar içerir','Atlas 24 benzersiz konu, 5 grup ve izinli 9 organla tutarlı bağlantılar içerir')
          replace('tests/biology-atlas.test.js','assert.equal(topics.length,24);assert.equal(organs.length,10);assert.equal(groups.length,5);','assert.equal(topics.length,24);assert.equal(organs.length,9);assert.equal(groups.length,5);')
          replace('tests/biology-atlas.test.js','assert.equal(new Set(organs.map(t=>t.id)).size,10);','assert.equal(new Set(organs.map(t=>t.id)).size,9);')
          sub('tests/biology-atlas.test.js',r'\n    if\(organ\.id==="ear"\)\{[^\n]*continue;\}','')
          replace('tests/biology-atlas.test.js','10 organın 60 yapısı benzersiz, konumlu ve ayrıntılıdır; beyin sınıflaması açık ayrılır','9 organın 52 yapısı benzersiz, konumlu ve ayrıntılıdır; beyin sınıflaması açık ayrılır')
          replace('tests/biology-atlas.test.js','assert.equal(total,60);','assert.equal(total,52);')
          replace('tests/biology-atlas.test.js','["heart","brain","ear"].includes(id)','["heart","brain"].includes(id)')
          replace('tests/biology-atlas.test.js','On organın 60 yapısı 3B seçime bağlanır; seçim başına model yükleyicisi yeniden çağrılmaz','Dokuz organın 52 yapısı 3B seçime bağlanır; seçim başına model yükleyicisi yeniden çağrılmaz')
          replace('tests/biology-atlas.test.js','assert.equal(downloads,10);h.click("organ-view","model");assert.equal(downloads,10);h.click("organ-view","anatomy");assert.equal(disposed,10);','assert.equal(downloads,9);h.click("organ-view","model");assert.equal(downloads,9);h.click("organ-view","anatomy");assert.equal(disposed,9);')

          # Release notes reflect the smaller atlas and no custom ear asset.
          replace('RELEASE.md','- 10 organ üzerinde dönen kameraya bağlı toplam 60 YKS işareti; içeride 60 seçilebilir, hacimli öğretici 3B yapı.','- 9 organ üzerinde dönen kameraya bağlı toplam 52 YKS işareti; içeride 52 seçilebilir, hacimli öğretici 3B yapı.')
          sub('RELEASE.md',r'^- Kulak atlasında kullanıcının gönderdiği anatomik kesit referansından hazırlanan özel yaklaşık 1,6 MB GLB.*\n','',flags=re.M)
          replace('RELEASE.md','- Geometri, kesme düzlemleri, paylaşılan kaynak temizliği, 60 seçim, 109 çizim, kulak referans kesitinin 51 ayrı mesh ile oluşturulması, kapalı görünüm anatomisi, yükleme yarışları ve eski laboratuvar regresyonları otomatik test kapsamındadır.','- Geometri, kesme düzlemleri, paylaşılan kaynak temizliği, 52 seçim, 109 çizim, kapalı görünüm anatomisi, yükleme yarışları ve eski laboratuvar regresyonları otomatik test kapsamındadır.')

          # Structural ear IDs/assets should now be gone. Turkish curriculum text
          # about hearing/balance is intentionally retained.
          residual=[]
          checks=[
              ('src/data/biology-atlas.ts','"ear"'),
              ('src/data/biology-organs.ts','\n  ear:{'),
              ('src/data/biology-organ-landmarks.ts','\n  ear:{'),
              ('src/ui/biology-organ-interiors.ts','case "ear"'),
              ('src/ui/biology-organ-diagrams.ts','\n  ear:`'),
              ('src/ui/biology-atlas-model.ts','==="ear"'),
              ('src/ui/biology-atlas.ts','==="ear"'),
              ('scripts/verify-dist.mjs','ear.glb'),
          ]
          for path,needle in checks:
              if needle in read(path): residual.append(f'{path}: {needle}')
          if residual:
              raise SystemExit('Residual ear atlas references:\n'+'\n'.join(residual))
          PY
          git rm -f public/anatomy/models/ear.glb
      - name: Verify release
        run: npm run release:check
      - name: Show remaining ear-id references
        shell: bash
        run: |
          git grep -n -E '"ear"|ear\.glb|case "ear"|^[[:space:]]*ear:' -- src tests scripts RELEASE.md || true
      - name: Commit removal and delete one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/remove-ear-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(atlas): remove ear section"
          git push
