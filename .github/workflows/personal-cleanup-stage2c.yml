name: Personal cleanup stage 2c

on:
  push:
    paths:
      - '.github/workflows/personal-cleanup-stage2c.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: "${{ github.event.head_commit.message == 'chore: tek kullanıcı temizliği aşama 2c' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Mevcut doğrulanmış yamayı uygula
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/personal-cleanup-stage2b.yml').read_text()
          start=s.index("          node <<'NODE'\n")+len("          node <<'NODE'\n")
          end=s.index("\n          NODE",start)
          lines=s[start:end].splitlines()
          script='\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          Path('/tmp/personal-patch.js').write_text(script)
          PY
          node /tmp/personal-patch.js
      - name: Regresyon assertion düzeltmesi
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/package.test.js');s=p.read_text()
          bad='assert.match(app,/manualReviews||[]).forEach/);'
          good='assert.ok(app.includes("manualReviews||[]).forEach"));'
          if bad not in s: raise SystemExit('üretilen hatalı assertion bulunamadı')
          p.write_text(s.replace(bad,good))
          PY
      - name: Tam sürüm kontrolü
        run: npm run release:check
      - name: Yalnız uygulama değişikliklerini commit et
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html app.css modules/error-journal.js tests
          git diff --cached --check
          git commit -m "refactor: kişisel tek kullanıcı akışını derinleştir"
          git push origin HEAD:main
