name: Install deneme archive UI

on:
  push:
    paths:
      - '.github/workflows/feature-deneme-archive.yml'

permissions:
  contents: write

jobs:
  install:
    if: "${{ github.event.head_commit.message == 'chore: install deneme archive ui' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deneme arşivini arayüze bağla
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const read=f=>fs.readFileSync(f,'utf8'),write=(f,s)=>fs.writeFileSync(f,s,'utf8');
          let html=read('index.html');
          if(!html.includes('id="v4TrialArchive"')){
            const anchor='  <button class="foldhead" id="fh_gecmis" onclick="toggleFold(\'gecmis\')">';
            if(!html.includes(anchor))throw new Error('Deneme arşivi HTML anchor bulunamadı');
            const block=`  <button class="foldhead" id="fh_deneme_kaynak" onclick="toggleFold('deneme_kaynak')">\n    <span class="ft">Deneme Arşivi</span>\n    <span class="fi"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span>\n  </button>\n  <div class="foldbody" id="fb_deneme_kaynak">\n    <section id="v4TrialArchive" class="v4-trial-archive" aria-labelledby="v4TrialArchiveTitle">\n      <div class="v4-trial-head"><div><p class="eyebrow">21. aşama</p><h2 id="v4TrialArchiveTitle">Deneme Arşivi</h2><p class="hint">TYT/AYT deneme kaynaklarını ara, favorile, çözdüklerini işaretle ve Telegram kaynağında aç.</p></div><button class="btn ghost tiny" type="button" onclick="v4TrialArchiveRender()">Yenile</button></div>\n      <div class="card flat v4-trial-toolbar">\n        <input type="search" id="v4TrialSearch" placeholder="Deneme, yayın veya yıl ara" oninput="v4TrialArchiveRender()">\n        <select id="v4TrialExam" onchange="v4TrialArchiveRender()" aria-label="Sınav türü"><option>Tümü</option><option>TYT</option><option>AYT</option></select>\n        <select id="v4TrialYear" onchange="v4TrialArchiveRender()" aria-label="Yıl"><option>Tümü</option><option>2026</option><option>2025</option></select>\n        <label><input type="checkbox" id="v4TrialFavOnly" onchange="v4TrialArchiveRender()"> Favoriler</label>\n        <label><input type="checkbox" id="v4TrialDoneOnly" onchange="v4TrialArchiveRender()"> Çözdüklerim</label>\n        <button class="btn ghost tiny" type="button" onclick="v4TrialResetFilters()">Temizle</button>\n      </div>\n      <p class="hint" id="v4TrialArchiveMeta"></p>\n      <div class="v4-trial-grid" id="v4TrialArchiveGrid"></div>\n      <p class="note">PDF dosyaları uygulamanın içine kopyalanmaz; kaynak bağlantısı Telegram'da açılır. Böylece site hafif kalır ve arşiv tek yerden takip edilir.</p>\n    </section>\n  </div>\n\n`;
            html=html.replace(anchor,block+anchor);
          }
          if(!html.includes('modules/trial-archive.js')){
            const anchor='<script vite-ignore src="./modules/release-selftest.js?v=4.1.0-r20"></script>';
            if(!html.includes(anchor))throw new Error('Script anchor bulunamadı');
            html=html.replace(anchor,'<script vite-ignore src="./modules/trial-archive.js?v=4.1.0-r21"></script>\n'+anchor);
          }
          write('index.html',html);

          let css=read('app.css');
          if(!css.includes('v4.1.0-r21 — Deneme Arşivi'))css+=`\n\n/* v4.1.0-r21 — Deneme Arşivi */\n.v4-trial-archive{padding:2px 0 8px}.v4-trial-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}.v4-trial-head h2{margin:2px 0 4px}.v4-trial-toolbar{display:grid;grid-template-columns:minmax(220px,1.7fr) repeat(2,minmax(120px,.7fr)) auto auto auto;gap:10px;align-items:center}.v4-trial-toolbar label{display:flex;align-items:center;gap:7px;font-size:13px;white-space:nowrap}.v4-trial-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.v4-trial-card{border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--card);box-shadow:var(--shadow-sm,0 2px 10px rgba(0,0,0,.04))}.v4-trial-card.is-done{opacity:.82}.v4-trial-card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.v4-trial-card h3{font-size:16px;line-height:1.3;margin:5px 0 0}.v4-trial-card p{font-size:13.5px;line-height:1.55;margin:10px 0;color:var(--muted)}.v4-trial-kind{font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--green)}.v4-trial-icon{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--muted);min-width:44px;min-height:44px}.v4-trial-icon.on{color:#d99a00}.v4-trial-tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px}.v4-trial-tags span{font-size:11px;padding:5px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}.v4-trial-actions{display:flex;gap:8px}.v4-trial-actions .btn{flex:1;text-align:center;text-decoration:none}.v4-trial-actions a.btn{display:flex;align-items:center;justify-content:center}@media(max-width:900px){.v4-trial-toolbar{grid-template-columns:1fr 1fr}.v4-trial-toolbar input[type=search]{grid-column:1/-1}.v4-trial-grid{grid-template-columns:1fr}}@media(max-width:520px){.v4-trial-toolbar{grid-template-columns:1fr}.v4-trial-toolbar input[type=search]{grid-column:auto}.v4-trial-actions{flex-direction:column}}\n`;
          write('app.css',css);

          let test=read('tests/package.test.js');
          if(!test.includes('Deneme Arşivi Telegram kaynaklarını'))test+=`\n\ntest("v4 Deneme Arşivi Telegram kaynaklarını filtrelenebilir ve yerel durumlu gösterir",()=>{\n  const html=fs.readFileSync(path.join(root,"index.html"),"utf8"),mod=fs.readFileSync(path.join(root,"modules/trial-archive.js"),"utf8"),css=fs.readFileSync(path.join(root,"app.css"),"utf8");\n  ["v4TrialArchive","v4TrialSearch","v4TrialExam","v4TrialYear","v4TrialArchiveGrid"].forEach(id=>assert.match(html,new RegExp(\`id="\${id}"\`),id));\n  assert.match(html,/modules\\/trial-archive\\.js\\?v=4\\.1\\.0-r21/);assert.match(mod,/yks_trial_archive_v1/);assert.match(mod,/yks_kpss_pdf_kanal/);assert.match(mod,/v4TrialToggleFav/);assert.match(mod,/v4TrialToggleDone/);assert.match(css,/v4\\.1\\.0-r21 — Deneme Arşivi/);\n  assert.doesNotMatch(mod,/\\.pdf["']/i);\n});\n`;
          write('tests/package.test.js',test);
          NODE
      - name: Kontroller
        run: npm run release:check
      - name: Geçici işi kaldır ve commit et
        shell: bash
        run: |
          rm .github/workflows/feature-deneme-archive.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.css tests/package.test.js .github/workflows/feature-deneme-archive.yml
          git diff --cached --check
          git commit -m "21. aşama: Deneme Arşivini arayüze bağla"
          git push origin HEAD:main
