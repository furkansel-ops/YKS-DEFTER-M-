name: V6 gerçek tarayıcı önizleme

on:
  push:
    branches:
      - redesign/v6-real-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Build ve test
        run: |
          npm run typecheck
          npm test
          npm run build:assets

      - name: Chromium önizleme aracını kur
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Preview sunucusunu başlat
        run: |
          npm run preview -- --host 127.0.0.1 --port 4174 > /tmp/v6-preview.log 2>&1 &
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4174/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v6-preview.log
          exit 1

      - name: Gerçek mobil ekran görüntüsü al
        run: |
          cat > .v6-capture.mjs <<'NODE'
          import { chromium } from "playwright";

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({
            viewport:{width:390,height:844},
            deviceScaleFactor:2,
            isMobile:true,
            hasTouch:true
          });

          await page.goto("http://127.0.0.1:4174/",{waitUntil:"networkidle"});
          await page.waitForSelector('#home[data-v6-home="ready"]',{timeout:15000});

          await page.evaluate(()=>{
            document.querySelectorAll(".screen").forEach(node=>node.classList.remove("active"));
            const home=document.getElementById("home");
            home?.classList.add("active");

            document.querySelectorAll('[role="dialog"],.modal,.overlay').forEach(node=>{
              const el=node;
              if(el instanceof HTMLElement && !el.closest("#home"))el.style.display="none";
            });

            const set=(id,value)=>{
              const el=document.getElementById(id);
              if(el)el.textContent=value;
            };
            set("greeting","Günaydın, Furkan");
            set("todayHubQ","86");
            set("todayHubQSub","120 hedef");
            set("todayHubMin","78 dk");
            set("todayHubMinSub","120 dk hedef");
            set("todayHubPlan","3 / 5");
            set("todayHubPlanSub","2 görev kaldı");
            set("todayHubReview","2");
            set("todayHubReviewSub","bekleyen");
            set("countdown","269");
            set("examDateLabel","2027 YKS");
            set("streakPlan","6");
            set("streakTarget","4");

            const plan=document.getElementById("todayPlan");
            if(plan){
              plan.innerHTML=[
                '<div class="plancell"><div><b>Matematik</b><small>Problemler · 30 soru</small></div></div>',
                '<div class="plancell"><div><b>Fizik</b><small>Kuvvet ve Hareket · 40 dk</small></div></div>',
                '<div class="plancell"><div><b>Biyoloji</b><small>Hücre · kısa tekrar</small></div></div>',
                '<div class="plancell pd"><div><b>Türkçe</b><small>Paragraf · 25 soru</small></div></div>'
              ].join("");
            }

            document.documentElement.setAttribute("data-theme","paper");
            window.scrollTo(0,0);
          });

          await page.waitForTimeout(400);
          await page.screenshot({path:"v6-home-real.png",fullPage:true});
          await browser.close();
          NODE
          node .v6-capture.mjs

      - name: Screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: v6-home-real-screenshot
          path: v6-home-real.png
          if-no-files-found: error
          retention-days: 7
