<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="robots" content="noindex,nofollow">
  <title>YKS Defterim · Hesap İşlemi</title>
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <style>
    :root{color-scheme:dark;--bg:#090d16;--card:#111827;--card2:#172033;--text:#f8fafc;--muted:#9ca3af;--line:#263247;--accent:#34d399;--accent2:#10b981;--danger:#f87171}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at top,#17233a 0,#090d16 44%,#070a11 100%);color:var(--text);display:grid;place-items:center;padding:24px}
    .shell{width:min(100%,520px)}
    .brand{display:flex;align-items:center;gap:14px;margin:0 0 18px 2px}
    .brand img{width:52px;height:52px;border-radius:15px;box-shadow:0 12px 35px rgba(0,0,0,.3)}
    .brand b{display:block;font-size:21px;letter-spacing:-.02em}.brand span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
    .card{background:linear-gradient(180deg,rgba(23,32,51,.96),rgba(17,24,39,.98));border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:800;margin-bottom:9px}
    h1{font-size:27px;line-height:1.15;margin:0 0 10px;letter-spacing:-.035em}p{color:var(--muted);line-height:1.6;margin:0 0 20px}
    label{display:block;font-size:13px;font-weight:700;margin:15px 0 7px;color:#dbe4f0}
    input{width:100%;border:1px solid var(--line);background:#0b1220;color:var(--text);border-radius:14px;padding:14px 15px;font-size:16px;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(52,211,153,.12)}
    button,.link{width:100%;display:inline-flex;justify-content:center;align-items:center;border:0;border-radius:14px;padding:14px 16px;font-size:15px;font-weight:800;text-decoration:none;cursor:pointer;margin-top:15px}
    button{background:linear-gradient(180deg,var(--accent),var(--accent2));color:#052e22}.link{background:#1f2937;color:#e5e7eb;border:1px solid var(--line)}
    button:disabled{opacity:.55;cursor:not-allowed}.status{border:1px solid var(--line);background:#0b1220;border-radius:14px;padding:13px 14px;font-size:14px;line-height:1.5;color:#cbd5e1;margin-top:14px}.status.ok{border-color:rgba(52,211,153,.45);color:#a7f3d0}.status.err{border-color:rgba(248,113,113,.45);color:#fecaca}
    .fine{font-size:12px;color:#718096;margin-top:18px;text-align:center}.hidden{display:none!important}
  </style>
</head>
<body>
<main class="shell">
  <div class="brand">
    <img src="./icon-192.png" alt="YKS Defterim logosu">
    <div><b>YKS Defterim</b><span>Güvenli hesap işlemi</span></div>
  </div>
  <section class="card" aria-live="polite">
    <div class="eyebrow" id="eyebrow">Hesap güvenliği</div>
    <h1 id="title">İşlem hazırlanıyor…</h1>
    <p id="desc">Bağlantı doğrulanıyor.</p>

    <form id="resetForm" class="hidden">
      <label for="newPassword">Yeni şifre</label>
      <input id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="En az 8 karakter">
      <label for="newPassword2">Yeni şifreyi tekrar yaz</label>
      <input id="newPassword2" type="password" minlength="8" autocomplete="new-password" required placeholder="Şifreyi tekrar yaz">
      <button id="resetButton" type="submit">Şifremi yenile</button>
    </form>

    <div id="status" class="status hidden"></div>
    <a id="backLink" class="link" href="./">YKS Defterim'e dön</a>
  </section>
  <div class="fine">Bu sayfa yalnızca YKS Defterim hesap doğrulama ve şifre yenileme işlemleri içindir.</div>
</main>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';
  import { getAuth, applyActionCode, verifyPasswordResetCode, confirmPasswordReset, checkActionCode } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';

  const q = new URLSearchParams(location.search);
  const mode = q.get('mode') || '';
  const oobCode = q.get('oobCode') || '';
  const apiKey = q.get('apiKey') || '';

  const title = document.getElementById('title');
  const desc = document.getElementById('desc');
  const eyebrow = document.getElementById('eyebrow');
  const status = document.getElementById('status');
  const resetForm = document.getElementById('resetForm');
  const resetButton = document.getElementById('resetButton');

  function showStatus(message, kind='') {
    status.textContent = message;
    status.className = `status ${kind}`.trim();
  }
  function fail(message) {
    eyebrow.textContent = 'Bağlantı geçersiz';
    title.textContent = 'İşlem tamamlanamadı';
    desc.textContent = 'Bağlantının süresi dolmuş, daha önce kullanılmış veya hatalı olabilir.';
    showStatus(message, 'err');
  }
  function authErrorMessage(error) {
    const code = String(error?.code || '');
    if (code.includes('expired-action-code')) return 'Bu bağlantının süresi dolmuş. Uygulamadan yeni bir bağlantı iste.';
    if (code.includes('invalid-action-code')) return 'Bu bağlantı geçersiz veya daha önce kullanılmış. Uygulamadan yeni bir bağlantı iste.';
    if (code.includes('weak-password')) return 'Daha güçlü bir şifre seç. En az 8 karakter kullanmanı öneriyoruz.';
    if (code.includes('user-disabled')) return 'Bu hesap devre dışı bırakılmış.';
    return 'İşlem sırasında bir hata oluştu. Uygulamadan yeni bir bağlantı isteyip tekrar dene.';
  }

  if (!apiKey || !oobCode || !mode) {
    fail('Gerekli doğrulama bilgileri bağlantıda bulunamadı.');
  } else {
    const app = initializeApp({ apiKey });
    const auth = getAuth(app);
    auth.languageCode = 'tr';

    if (mode === 'verifyEmail') {
      eyebrow.textContent = 'E-posta doğrulama';
      title.textContent = 'E-posta adresin doğrulanıyor';
      desc.textContent = 'YKS Defterim hesabını güvenli biçimde doğruluyoruz.';
      try {
        await applyActionCode(auth, oobCode);
        title.textContent = 'E-posta adresin doğrulandı ✓';
        desc.textContent = 'Hesabın artık doğrulanmış durumda. YKS Defterim’e geri dönebilirsin.';
        showStatus('Doğrulama başarıyla tamamlandı.', 'ok');
      } catch (error) { fail(authErrorMessage(error)); }
    } else if (mode === 'resetPassword') {
      eyebrow.textContent = 'Şifre yenileme';
      title.textContent = 'Yeni şifreni belirle';
      desc.textContent = 'YKS Defterim hesabın için yeni bir şifre oluştur.';
      try {
        const email = await verifyPasswordResetCode(auth, oobCode);
        resetForm.classList.remove('hidden');
        showStatus(`Şifre yenilenecek hesap: ${email}`);
        resetForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          const p1 = document.getElementById('newPassword').value;
          const p2 = document.getElementById('newPassword2').value;
          if (p1.length < 8) return showStatus('Şifre en az 8 karakter olmalı.', 'err');
          if (p1 !== p2) return showStatus('Yazdığın iki şifre aynı değil.', 'err');
          resetButton.disabled = true;
          resetButton.textContent = 'Kaydediliyor…';
          try {
            await confirmPasswordReset(auth, oobCode, p1);
            resetForm.classList.add('hidden');
            title.textContent = 'Şifren yenilendi ✓';
            desc.textContent = 'Yeni şifrenle YKS Defterim hesabına giriş yapabilirsin.';
            showStatus('Şifre değişikliği başarıyla tamamlandı.', 'ok');
          } catch (error) {
            showStatus(authErrorMessage(error), 'err');
            resetButton.disabled = false;
            resetButton.textContent = 'Şifremi yenile';
          }
        });
      } catch (error) { fail(authErrorMessage(error)); }
    } else if (mode === 'recoverEmail') {
      eyebrow.textContent = 'E-posta kurtarma';
      title.textContent = 'E-posta değişikliği geri alınıyor';
      desc.textContent = 'Hesabının önceki e-posta adresini geri yüklüyoruz.';
      try {
        await checkActionCode(auth, oobCode);
        await applyActionCode(auth, oobCode);
        title.textContent = 'E-posta adresi geri yüklendi ✓';
        desc.textContent = 'Hesabının e-posta değişikliği başarıyla geri alındı.';
        showStatus('Hesap bilgilerin güncellendi.', 'ok');
      } catch (error) { fail(authErrorMessage(error)); }
    } else {
      fail('Bu bağlantı YKS Defterim tarafından desteklenen bir hesap işlemi içermiyor.');
    }
  }
</script>
</body>
</html>
